    <script>
        // Toast notification system
        class Toast {
            static DURATION = 3000;

            static show(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast-msg toast-${type}`;
                toast.textContent = message;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, Toast.DURATION);
            }

            static success(message) { this.show(message, 'success'); }
            static error(message) { this.show(message, 'error'); }
            static info(message) { this.show(message, 'info'); }
        }

        class Card {
            constructor(data = {}) {
                this.seqno = data.seqno != null ? data.seqno : undefined;
                this.mode = data.mode || 'Task';
                this.topic = data.topic || '';
                this.category = data.category || '';
                this.priority = data.priority || 'Normal';
                this.startsOn = data.startsOn || '';
                this.endsOn = data.endsOn || '';
                this.description = data.description || '';
                this.tags = data.tags || [];
                this.steps = data.steps || [];
                this.data = data.data || {};
                this.links = data.links || [];
                this.attachments = data.attachments || [];
                this.recurrence = data.recurrence || { freq: [], days: [], period: [] };
                // Handle legacy recurrence format (array)
                if (Array.isArray(this.recurrence)) {
                    this.recurrence = { freq: [], days: this.recurrence, period: [] };
                }
                this.parent = data.parent || '';
                this.children = data.children || [];
                this.completed = data.completed || false;
            }

            validate() {
                if (!this.topic || this.topic.trim().length === 0) {
                    throw new Error('Topic is required');
                }
                if (this.topic.length > CardManager.CONFIG.LIMITS.TOPIC_MAX_LENGTH) {
                    throw new Error(`Topic must be ${CardManager.CONFIG.LIMITS.TOPIC_MAX_LENGTH} characters or less`);
                }
                if (this.category && this.category.length > CardManager.CONFIG.LIMITS.CATEGORY_MAX_LENGTH) {
                    throw new Error(`Category must be ${CardManager.CONFIG.LIMITS.CATEGORY_MAX_LENGTH} characters or less`);
                }
                return true;
            }

            toJSON() {
                return {
                    seqno: this.seqno,
                    mode: this.mode,
                    topic: this.topic,
                    category: this.category,
                    priority: this.priority,
                    startsOn: this.startsOn,
                    endsOn: this.endsOn,
                    description: this.description,
                    tags: this.tags,
                    steps: this.steps,
                    data: this.data,
                    links: this.links,
                    attachments: this.attachments,
                    recurrence: this.recurrence,
                    parent: this.parent,
                    children: this.children,
                    completed: this.completed
                };
            }
        }

        // IndexedDB helper
        const DB = {
            _db: null,
            open() {
                if (this._db) return Promise.resolve(this._db);
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('cardmanager_db', 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('cards')) {
                            db.createObjectStore('cards', { keyPath: 'key' });
                        }
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files', { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = (e) => { this._db = e.target.result; resolve(this._db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async get(store, key) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).get(key);
                    req.onsuccess = (e) => resolve(e.target.result || null);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async put(store, value) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    const req = tx.objectStore(store).put(value);
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async getAll(store) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = (e) => resolve(e.target.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async delete(store, key) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    const req = tx.objectStore(store).delete(key);
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            }
        };

        class CardManager {
            // Configuration Constants
            static CONFIG = {
                LIMITS: {
                    TAG_MAX_LENGTH: 100,
                    STEP_MAX_LENGTH: 100,
                    LINK_MAX_LENGTH: 500,
                    ATTACHMENT_MAX_LENGTH: 500,
                    CATEGORY_MAX_LENGTH: 50,
                    TOPIC_MAX_LENGTH: 100,
                    DESC_MAX_LENGTH: 5000,
                    KEY_MAX_LENGTH: 50,
                    VALUE_MAX_LENGTH: 200
                },
                UI: {
                    TOAST_DURATION: 3000,
                    LINK_TRUNCATE_AT: 47,
                    DESC_TRUNCATE_AT: 50,
                    DESC_EXPAND_AT: 200
                },
                VALIDATION: {
                    URL_PATTERN: /^https?:\/\/.+/i,
                    MIN_TOPIC_LENGTH: 1
                }
            };

            static MODES = ['Task', 'Note', 'Data', 'List'];
            static PRIORITIES = ['Acute', 'Normal', 'Optional'];
            static PRIORITY_COLORS = {
                'Acute':    '#ef4444',
                'Normal':   '#10b981',
                'Optional': '#3b82f6'
            };

            constructor() {
                // Three-section data model
                this.activeCards = [];      // Cards currently in use
                this.completedCards = [];   // Cards marked as completed
                this.deletedCards = [];     // Cards that have been deleted
                
                this.nextSeqno = 1;
                this.currentEditingSeqno = null;
                this.selectedMode = 'Task';
                this.selectedPriority = 'Normal';
                this.cardView = 'active';
                this.draggedElement = null;
                this.undoStack = [];
                this.redoStack = [];
                this.maxUndoSteps = 50;
                this.layoutMode = 'card-mode';
				this.sortFields = [];
				this.lastDisplayedCards = [];
                this.pendingFilter = null;
                this.pendingSort = [];
                this.selectedSeqnos = new Set();
                this._cardClickAbort = null;
                this._categoriesDirty = true;
                this._openMenuCard = null;
                this._saveTimer = null;
                // Field visibility config — all on by default
                this.visibleFields = {
                    description: true,
                    infoline:    true,
                    tags:        true,
                    steps:       true,
                    data:        true,
                    parent:      true,
                    children:    true,
                    links:       true,
                    attachments: true,
                    recurrence:  true
                };
                this.init();
            }

            /**
             * Safely get element by ID with optional null check
             * @param {string} id - Element ID
             * @param {boolean} required - Whether element is required (throws if not found)
             * @returns {HTMLElement|null} The element or null
             */
            safeGetElement(id, required = false) {
                const element = document.getElementById(id);
                if (!element) {
                    const msg = `Element not found: ${id}`;
                    if (required) {
                        console.error(msg);
                        throw new Error(msg);
                    }
                    console.warn(msg);
                }
                return element;
            }

            /**
             * Safely clone an object using structuredClone (with fallback)
             * @param {Object} obj - Object to clone
             * @returns {Object} Deep cloned object
             */
            safeClone(obj) {
                try {
                    // Use modern structuredClone if available (Chrome 98+, Firefox 94+, Safari 15.4+)
                    if (typeof structuredClone === 'function') {
                        return structuredClone(obj);
                    }
                    // Fallback to JSON method for older browsers
                    return JSON.parse(JSON.stringify(obj));
                } catch (error) {
                    console.error('Clone error:', error);
                    // Last resort fallback
                    return JSON.parse(JSON.stringify(obj));
                }
            }

            // Undo/Redo System
            recordAction(action, data) {
                this.undoStack.push({
                    action,
                    data: this.safeClone(data), // Deep clone with modern API
                    timestamp: Date.now()
                });
                
                // Limit stack size
                if (this.undoStack.length > this.maxUndoSteps) {
                    this.undoStack.shift();
                }
                
                // Clear redo stack on new action
                this.redoStack = [];
                // Sync button states
                if (document.getElementById('undo-btn')) this.syncUndoRedoButtons();
            }

            undo() {
                if (this.undoStack.length === 0) {
                    Toast.info('Nothing to undo');
                    return;
                }

                const entry = this.undoStack.pop();
                this.redoStack.push(entry);

                switch (entry.action) {
                    case 'create': {
                        const idx = this.activeCards.findIndex(c => c.seqno === entry.data.seqno);
                        if (idx !== -1) {
                            this.activeCards.splice(idx, 1);
                            this._categoriesDirty = true;
                            this.debouncedSave();
                            this.render();
                        }
                        break;
                    }
                    case 'delete': {
                        // Remove from deletedCards where deleteCard() placed it
                        const delIdx = this.deletedCards.findIndex(c => c.seqno === entry.data.seqno);
                        if (delIdx !== -1) this.deletedCards.splice(delIdx, 1);
                        // Restore to the originating list based on completed flag
                        const restored = new Card(entry.data);
                        restored.seqno = entry.data.seqno;
                        const destList = restored.completed ? this.completedCards : this.activeCards;
                        destList.push(restored);
                        destList.sort((a, b) => a.seqno - b.seqno);
                        this._categoriesDirty = true;
                        this.debouncedSave();
                        this.render();
                        break;
                    }
                    case 'update': {
                        const seqno = entry.data.seqno;
                        for (const list of [this.activeCards, this.completedCards, this.deletedCards]) {
                            const idx = list.findIndex(c => c.seqno === seqno);
                            if (idx !== -1) {
                                const restored = new Card(entry.data);
                                restored.seqno = seqno;
                                list[idx] = restored;
                                this._categoriesDirty = true;
                                this.debouncedSave();
                                this.render();
                                break;
                            }
                        }
                        break;
                    }
                }

                Toast.success('Undo successful');
                this.syncUndoRedoButtons();
            }

            redo() {
                if (this.redoStack.length === 0) {
                    Toast.info('Nothing to redo');
                    return;
                }

                const entry = this.redoStack.pop();
                this.undoStack.push(entry);

                switch (entry.action) {
                    case 'create': {
                        const card = new Card(entry.data);
                        card.seqno = entry.data.seqno;
                        this.activeCards.push(card);
                        this.activeCards.sort((a, b) => a.seqno - b.seqno);
                        this._categoriesDirty = true;
                        this.debouncedSave();
                        this.render();
                        break;
                    }
                    case 'delete': {
                        let srcList = null;
                        let srcIdx = this.activeCards.findIndex(c => c.seqno === entry.data.seqno);
                        if (srcIdx !== -1) {
                            srcList = this.activeCards;
                        } else {
                            srcIdx = this.completedCards.findIndex(c => c.seqno === entry.data.seqno);
                            if (srcIdx !== -1) srcList = this.completedCards;
                        }
                        if (srcList) {
                            const [card] = srcList.splice(srcIdx, 1);
                            this.deletedCards.push(card);
                            this.deletedCards.sort((a, b) => a.seqno - b.seqno);
                            this._categoriesDirty = true;
                            this.debouncedSave();
                            this.render();
                        }
                        break;
                    }
                    case 'update': {
                        const seqno = entry.data.seqno;
                        for (const list of [this.activeCards, this.completedCards, this.deletedCards]) {
                            const idx = list.findIndex(c => c.seqno === seqno);
                            if (idx !== -1) {
                                const restored = new Card(entry.data);
                                restored.seqno = seqno;
                                list[idx] = restored;
                                this._categoriesDirty = true;
                                this.debouncedSave();
                                this.render();
                                break;
                            }
                        }
                        break;
                    }
                }

                Toast.success('Redo successful');
                this.syncUndoRedoButtons();
            }

            // Input Validation
            validateForm() {
                const errors = [];
                
                // Topic is required - but can be in the topic field OR extracted from description
                let topic = this.safeGetElement('topic', true).value.trim();
                
                // If topic field is empty, check if description has a topic (text before '::')
                if (!topic) {
                    const description = this.safeGetElement('description').value.trim();
                    const topicMarkerIndex = description.indexOf('::');
                    if (topicMarkerIndex !== -1) {
                        topic = description.substring(0, topicMarkerIndex).trim();
                        // Strip leading # characters
                        topic = topic.replace(/^#+\s*/, '');
                    }
                }
                
                if (!topic || topic.length < CardManager.CONFIG.VALIDATION.MIN_TOPIC_LENGTH) {
                    errors.push('Topic is required (enter in Topic field or use "Topic:: description" format)');
                }
                if (topic.length > CardManager.CONFIG.LIMITS.TOPIC_MAX_LENGTH) {
                    errors.push(`Topic must be ${CardManager.CONFIG.LIMITS.TOPIC_MAX_LENGTH} characters or less`);
                }
                
                // Category length check
                const category = this.safeGetElement('category', true).value.trim();
                if (category.length > CardManager.CONFIG.LIMITS.CATEGORY_MAX_LENGTH) {
                    errors.push(`Category must be ${CardManager.CONFIG.LIMITS.CATEGORY_MAX_LENGTH} characters or less`);
                }
                
                // Date validation
                const startsOn = this.safeGetElement('starts-on').value;
                const endsOn = this.safeGetElement('ends-on').value;
                
                if (startsOn && endsOn) {
                    const startDate = new Date(startsOn);
                    const endDate = new Date(endsOn);
                    
                    if (isNaN(startDate.getTime())) {
                        errors.push('Invalid start date');
                    }
                    if (isNaN(endDate.getTime())) {
                        errors.push('Invalid end date');
                    }
                    
                    if (startDate > endDate) {
                        errors.push('Start date must be before or equal to end date');
                    }
                }
                
                // Validate links (URLs)
                const linkInputs = Array.from(document.querySelectorAll('#links-items input'))
                    .map(i => i.value.trim())
                    .filter(v => v.length > 0);
                
                linkInputs.forEach(link => {
                    if (!CardManager.CONFIG.VALIDATION.URL_PATTERN.test(link)) {
                        errors.push(`Invalid URL: ${link.substring(0, 30)}...`);
                    }
                });
                
                // Check for potential XSS in topic/category
                const xssPattern = /<script|javascript:|on\w+=/i;
                if (xssPattern.test(topic)) {
                    errors.push('Topic contains invalid characters');
                }
                if (xssPattern.test(category)) {
                    errors.push('Category contains invalid characters');
                }
                
                // Validate attachments (file paths)
                const attachmentInputs = Array.from(document.querySelectorAll('#attachments-items input'))
                    .map(i => i.value.trim())
                    .filter(v => v.length > 0);
                
                attachmentInputs.forEach(path => {
                    if (path.length > CardManager.CONFIG.LIMITS.ATTACHMENT_MAX_LENGTH) {
                        errors.push(`File path too long (max ${CardManager.CONFIG.LIMITS.ATTACHMENT_MAX_LENGTH} chars)`);
                    }
                });
                
                // Validate recurrence makes sense
                const recurrenceFreq = Array.from(document.querySelectorAll('input[name="recurrence-freq"]:checked')).map(cb => cb.value);
                const recurrenceDays = Array.from(document.querySelectorAll('input[name="recurrence-day"]:checked')).map(cb => cb.value);
                const recurrencePeriod = Array.from(document.querySelectorAll('input[name="recurrence-period"]:checked')).map(cb => cb.value);
                
                if (recurrenceDays.length > 0 && recurrenceFreq.length === 0) {
                    errors.push('Must select frequency when selecting days');
                }
                if (recurrenceFreq.length > 0 && recurrencePeriod.length === 0) {
                    errors.push('Must select period when selecting frequency');
                }
                
                // Display errors or return success
                if (errors.length > 0) {
                    Toast.error(errors[0]); // Show first error
                    console.warn('Validation errors:', errors);
                    return false;
                }
                
                return true;
            }
            // Common Rendering Helpers (reduce duplication)
            renderTags(tags) {
                if (!this.visibleFields.tags) return '';
                if (!tags || tags.length === 0) return '';
                // Sort tags alphabetically for consistent display
                const sortedTags = [...tags].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                return `
                    <div class="card-field">
                        <span class="card-field-label">tags:</span>
                        <div class="card-tags">
                            ${sortedTags.map(tag => `<span class="tag">${this.escapeHtml(tag)}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            renderLinks(links) {
                if (!this.visibleFields.links) return '';
                if (!links || links.length === 0) return '';
                return `
                    <div class="card-field">
                        <span class="card-field-label">links:</span>
                        <div class="card-tags">
                            ${links.map(link => {
                                const truncated = link.length > CardManager.CONFIG.UI.LINK_TRUNCATE_AT 
                                    ? link.substring(0, CardManager.CONFIG.UI.LINK_TRUNCATE_AT) + '...' 
                                    : link;
                                return `<a href="${this.escapeHtml(link)}" target="_blank" class="tag" style="color: #3b82f6; text-decoration: none;" title="${this.escapeHtml(link)}">🔗 ${this.escapeHtml(truncated)}</a>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            renderAttachments(attachments, cardSeqno) {
                if (!this.visibleFields.attachments) return '';
                if (!attachments || attachments.length === 0) return '';
                
                // Return placeholder that will be populated asynchronously
                return `
                    <div class="card-field">
                        <span class="card-field-label">attachments:</span>
                        <div class="card-attachments" id="attachments-${cardSeqno}">
                            <span style="color: #9ca3af; font-size: 12px;">Loading attachments...</span>
                        </div>
                    </div>
                `;
            }

            async loadAttachments(cardSeqno, attachments) {
                const container = document.getElementById(`attachments-${cardSeqno}`);
                if (!container) return;
                
                const attachmentElements = await Promise.all(attachments.map(async att => {
                    // Check if this is a file ID reference
                    if (att.startsWith('file:')) {
                        const fileId = att.replace('file:', '');
                        const file = await this.getFile(fileId);
                        
                        if (file) {
                            // For images, display inline
                            if (file.type.startsWith('image/')) {
                                return `
                                    <div class="attachment-preview" style="margin: 8px 0;">
                                        <img src="${file.data}" 
                                             alt="${this.escapeHtml(file.name)}" 
                                             style="max-width: 100%; max-height: 300px; border-radius: 4px; cursor: pointer;"
                                             onclick="window.open('${file.data}', '_blank')"
                                             title="Click to open in new tab">
                                        <div style="font-size: 11px; color: #6b7280; margin-top: 4px;">
                                            ${this.escapeHtml(file.name)} (${this.formatFileSize(file.size)})
                                        </div>
                                    </div>
                                `;
                            }
                            // For PDFs, show embed or link
                            else if (file.type === 'application/pdf') {
                                return `
                                    <div class="attachment-preview" style="margin: 8px 0;">
                                        <object data="${file.data}" type="application/pdf" width="100%" height="400px" style="border-radius: 4px;">
                                            <p>PDF preview not available. <a href="${file.data}" download="${this.escapeHtml(file.name)}" style="color: #14b8a6;">Download ${this.escapeHtml(file.name)}</a></p>
                                        </object>
                                        <div style="font-size: 11px; color: #6b7280; margin-top: 4px;">
                                            📄 ${this.escapeHtml(file.name)} (${this.formatFileSize(file.size)})
                                        </div>
                                    </div>
                                `;
                            }
                        }
                        return `<span class="tag" style="color: #ef4444;">❌ File not found</span>`;
                    }
                    // Regular file path (legacy)
                    return `<a href="file:///${this.escapeHtml(att.replace(/\\/g, '/'))}" 
                                class="tag" 
                                style="color: #059669; text-decoration: none; cursor: pointer;" 
                                title="${this.escapeHtml(att)}">📎 ${this.escapeHtml(att.split(/[/\\]/).pop() || att)}</a>`;
                }));
                
                container.innerHTML = attachmentElements.join('');
            }

            async getFile(fileId) {
                try {
                    return await DB.get('files', fileId);
                } catch (error) {
                    console.error('Error retrieving file:', error);
                    return null;
                }
            }

            renderRecurrence(recurrence) {
                if (!this.visibleFields.recurrence) return '';
                if (!recurrence || (!recurrence.freq?.length && !recurrence.days?.length && !recurrence.period?.length)) {
                    return '';
                }
                const parts = [];
                if (recurrence.freq?.length > 0) parts.push(recurrence.freq.join(', '));
                if (recurrence.days?.length > 0) parts.push(recurrence.days.join(', '));
                if (recurrence.period?.length > 0) parts.push(recurrence.period.join(', '));
                const recurrenceStr = parts.join(' ');
                
                return `
                    <div class="card-field">
                        <span class="card-field-label">recurrence:</span>
                        <span class="recurrence-badge">🔄 ${this.escapeHtml(recurrenceStr)}</span>
                    </div>
                `;
            }

            renderParentChild(card) {
                let html = '';
                
                // Parent
                if (card.parent && this.visibleFields.parent) {
                    const parentCard = this.cards.find(c => c.topic === card.parent);
                    const parentTopic = parentCard ? parentCard.topic : card.parent;
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">parent:</span>
                            <span class="tag">${this.escapeHtml(parentTopic)}</span>
                        </div>
                    `;
                }
                
                // Children
                if (card.children && card.children.length > 0 && this.visibleFields.children) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">children:</span>
                            <div class="card-tags">
                                ${card.children.map(childSeqno => {
                                    const childCard = this.cards.find(c => c.seqno == childSeqno);
                                    const childTopic = childCard ? childCard.topic : childSeqno;
                                    return `<span class="tag">${this.escapeHtml(childTopic)}</span>`;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }
                
                return html;
            }

            async init() {
                await this.loadFromStorage();
                this._statActive    = document.getElementById('stat-active');
                this._statCompleted = document.getElementById('stat-completed');
                this._statDeleted   = document.getElementById('stat-deleted');
                this._statSelected  = document.getElementById('stat-selected');
                // Cache stable control refs used on every render
                this._renumBtn           = document.getElementById('renum-btn');
                this._restoreBtn         = document.getElementById('restore-btn');
                this._toggleFiltersortBtn = document.getElementById('toggle-filtersort-btn');
                this.initializeEventListeners();
                this.initializeInitialSteps();
                this.syncLayoutButton();
                this.syncUndoRedoButtons();
                this.render();
                this.hideLeftPanel();
            }

            initializeInitialSteps() {
                // Make the initial step in steps-container draggable
                const stepsContainer = document.getElementById('steps-items');
                if (stepsContainer) {
                    const initialStep = stepsContainer.querySelector('.array-item');
                    if (initialStep) {
                        this.makeDraggable(initialStep, () => this.renumberSteps());
                        this.renumberSteps();
                    }
                }
            }

            async loadFromStorage() {
                try {
                    const records = await DB.getAll('cards');
                    if (!records || records.length === 0) return;

                    // Migrate legacy single-blob format (key === 'main') to per-record format
                    const legacy = records.find(r => r.key === 'main');
                    if (legacy) {
                        this.activeCards    = (legacy.activeCards    || []).map(d => { const c = new Card(d); c.seqno = d.seqno; return c; });
                        this.completedCards = (legacy.completedCards || []).map(d => { const c = new Card(d); c.seqno = d.seqno; return c; });
                        this.deletedCards   = (legacy.deletedCards   || []).map(d => { const c = new Card(d); c.seqno = d.seqno; return c; });
                        const allCards = [...this.activeCards, ...this.completedCards, ...this.deletedCards];
                        this.nextSeqno = legacy.nextSeqno || (allCards.length > 0 ? Math.max(...allCards.map(c => c.seqno)) + 1 : 1);
                        if (legacy.layoutMode) this.layoutMode = legacy.layoutMode;
                        // Rewrite in new format (saveToStorage clears the store, removing 'main')
                        await this.saveToStorage();
                        console.log('Migrated from legacy single-blob storage format');
                        return;
                    }

                    // Per-record format: separate card records and the meta record
                    const meta        = records.find(r => r.key === 'meta');
                    const cardRecords = records.filter(r => r.key.startsWith('card:'));

                    this.activeCards    = [];
                    this.completedCards = [];
                    this.deletedCards   = [];

                    for (const r of cardRecords) {
                        const c = new Card(r);
                        c.seqno = parseInt(r.key.replace('card:', ''), 10);
                        if (r.status === 'completed')     this.completedCards.push(c);
                        else if (r.status === 'deleted')  this.deletedCards.push(c);
                        else                              this.activeCards.push(c);
                    }

                    this.activeCards.sort((a, b)    => a.seqno - b.seqno);
                    this.completedCards.sort((a, b) => a.seqno - b.seqno);
                    this.deletedCards.sort((a, b)   => a.seqno - b.seqno);

                    if (meta) {
                        this.nextSeqno = meta.nextSeqno || 1;
                        if (meta.layoutMode) this.layoutMode = meta.layoutMode;
                    } else {
                        const allCards = [...this.activeCards, ...this.completedCards, ...this.deletedCards];
                        this.nextSeqno = allCards.length > 0 ? Math.max(...allCards.map(c => c.seqno)) + 1 : 1;
                    }

                    console.log(`Loaded from IndexedDB: ${this.activeCards.length} active, ${this.completedCards.length} completed, ${this.deletedCards.length} deleted`);
                } catch (error) {
                    console.error('Error loading data:', error);
                    Toast.error('Error loading data');
                }
            }

            getDateOffset(days, hours = 0, minutes = 0) {
                const date = new Date();
                date.setDate(date.getDate() + days);
                date.setHours(hours, minutes, 0, 0);
                return date.toISOString().slice(0, 16);
            }

            async saveToStorage() {
                try {
                    const db = await DB.open();
                    await new Promise((resolve, reject) => {
                        const tx = db.transaction('cards', 'readwrite');
                        const store = tx.objectStore('cards');

                        // Clear existing records so renumbered or removed cards leave no orphans
                        store.clear();

                        for (const card of this.activeCards) {
                            store.put({ key: `card:${card.seqno}`, status: 'active', ...card.toJSON() });
                        }
                        for (const card of this.completedCards) {
                            store.put({ key: `card:${card.seqno}`, status: 'completed', ...card.toJSON() });
                        }
                        for (const card of this.deletedCards) {
                            store.put({ key: `card:${card.seqno}`, status: 'deleted', ...card.toJSON() });
                        }
                        store.put({ key: 'meta', nextSeqno: this.nextSeqno, layoutMode: this.layoutMode });

                        tx.oncomplete = () => resolve();
                        tx.onerror   = (e) => reject(e.target.error);
                    });
                    console.log(`Data saved: ${this.activeCards.length} active, ${this.completedCards.length} completed, ${this.deletedCards.length} deleted`);
                } catch (error) {
                    console.error('Error saving data:', error);
                    Toast.error('Error saving data');
                }
            }

            // Debounced save — batches rapid successive mutations into a single write (150 ms window)
            debouncedSave() {
                if (this._saveTimer) clearTimeout(this._saveTimer);
                this._saveTimer = setTimeout(() => {
                    this._saveTimer = null;
                    this.debouncedSave();
                }, 150);
            }

            createCard(cardData) {
                const card = new Card(cardData);
                card.validate();
                card.seqno = this.nextSeqno++;
                
                // Record for undo
                this.recordAction('create', { ...cardData, seqno: card.seqno });
                
                // New cards go to activeCards
                this.activeCards.push(card);
                this._categoriesDirty = true;
                this.debouncedSave();
                this.render();
                return card;
            }

            updateCard(seqno, cardData) {
                // Find card in any array
                let cardList = null;
                let index = -1;
                
                index = this.activeCards.findIndex(c => c.seqno === seqno);
                if (index !== -1) {
                    cardList = this.activeCards;
                } else {
                    index = this.completedCards.findIndex(c => c.seqno === seqno);
                    if (index !== -1) {
                        cardList = this.completedCards;
                    } else {
                        index = this.deletedCards.findIndex(c => c.seqno === seqno);
                        if (index !== -1) {
                            cardList = this.deletedCards;
                        }
                    }
                }
                
                if (!cardList) {
                    throw new Error('Card not found');
                }
                
                // Record old state for undo
                this.recordAction('update', cardList[index].toJSON());
                
                const card = new Card(cardData);
                card.validate();
                card.seqno = seqno;
                cardList[index] = card;
                this._categoriesDirty = true;
                this.debouncedSave();
                this.render();
                return card;
            }

            deleteCard(seqno) {
                // Find card in activeCards or completedCards
                let index = this.activeCards.findIndex(c => c.seqno === seqno);
                let sourceList = null;
                
                if (index !== -1) {
                    sourceList = this.activeCards;
                } else {
                    index = this.completedCards.findIndex(c => c.seqno === seqno);
                    if (index !== -1) {
                        sourceList = this.completedCards;
                    }
                }
                
                if (sourceList) {
                    // Record for undo
                    this.recordAction('delete', sourceList[index].toJSON());
                    
                    // Move to deletedCards (soft delete)
                    const [card] = sourceList.splice(index, 1);
                    this.deletedCards.push(card);
                    this.deletedCards.sort((a, b) => a.seqno - b.seqno);
                    this._categoriesDirty = true;
                    this.debouncedSave();
                    this.render();
                    Toast.success('Card deleted');
                }
            }

            getCard(seqno) {
                // Search all three arrays
                return this.activeCards.find(c => c.seqno === seqno) ||
                       this.completedCards.find(c => c.seqno === seqno) ||
                       this.deletedCards.find(c => c.seqno === seqno);
            }
            
            // Helper to get all cards combined (for compatibility)
            get cards() {
                return [...this.activeCards, ...this.completedCards, ...this.deletedCards];
            }
            
            // Helper to get only active cards
            getActiveCards() {
                return this.activeCards;
            }
            
            // Helper to get only completed cards
            getCompletedCards() {
                return this.completedCards;
            }
            
            // Helper to get only deleted cards
            getDeletedCards() {
                return this.deletedCards;
            }

            getAllCategories(mode = null) {
                const categories = new Set();
                this.activeCards.forEach(card => {
                    // Filter by mode if provided, otherwise get all
                    if (card.category && (!mode || card.mode === mode)) {
                        categories.add(card.category);
                    }
                });
                return Array.from(categories).sort();
            }

            getAllTopics() {
                return this.cards.map(c => ({ seqno: c.seqno, topic: c.topic }));
            }

            getAllTags(mode = null) {
                const tags = new Set();
                this.cards.forEach(card => {
                    if (card.tags && card.tags.length > 0 && (!mode || card.mode === mode)) {
                        card.tags.forEach(tag => tags.add(tag));
                    }
                });
                return Array.from(tags).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            }

            getFilteredCards() {
                const pf = this.pendingFilter;
                const filterMode     = pf ? pf.mode     : '';
                const filterPriority = pf ? pf.priority : '';
                const filterCategory = pf ? pf.category : '';
                const searchTopic    = pf ? pf.search.toLowerCase() : '';

                // Choose which cards to filter based on current view
                let cardsToFilter;
                if (this.cardView === 'completed') {
                    cardsToFilter = this.completedCards;
                } else if (this.cardView === 'deleted') {
                    cardsToFilter = this.deletedCards;
                } else {
                    cardsToFilter = this.activeCards;
                }
                
                return cardsToFilter.filter(card => {
                    if (filterMode && card.mode !== filterMode) return false;
                    if (filterPriority && card.priority !== filterPriority) return false;
                    if (filterCategory && card.category !== filterCategory) return false;
                    if (searchTopic && !card.topic.toLowerCase().includes(searchTopic)) return false;
                    return true;
                });
            }

            initializeEventListeners() {
                // Mode buttons
                document.querySelectorAll('[data-mode]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('btn-active'));
                        e.target.classList.add('btn-active');
                        this.selectedMode = e.target.dataset.mode;
                        this.updateFieldVisibility();
                        this.updateCategoryDatalist();  // Update categories for new mode
                        this.updateTagsDatalist();  // Update tags for new mode
                    });
                });

                // Priority buttons
                document.querySelectorAll('[data-priority]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-priority]').forEach(b => b.classList.remove('btn-active'));
                        e.target.classList.add('btn-active');
                        this.selectedPriority = e.target.dataset.priority;
                    });
                });

                // Toggle buttons

                    btn.addEventListener('click', (e) => {
                        const targetId = e.target.dataset.toggle;
                        const targetElement = this.safeGetElement(targetId);

                    });

                    this.clearAndResetForm();
                });

                    // Close the form and show the cards display (right panel)

                });
                
                document.getElementById('cycle-view-btn').addEventListener('click', () => {
                    // Cycle through active → completed → deleted → active
                    if (this.cardView === 'active') {
                        this.cardView = 'completed';
                    } else if (this.cardView === 'completed') {
                        this.cardView = 'deleted';
                    } else {
                        this.cardView = 'active';
                    }
                    this.render();
                    
                    // Update button tooltip to show current view
                    const button = document.getElementById('cycle-view-btn');
                    const viewNames = {
                        'active': 'Active Cards',
                        'completed': 'Completed Cards',
                        'deleted': 'Deleted Cards'
                    };

                document.getElementById('add-link-btn').addEventListener('click', () => this.addArrayItem('links-items', 'Enter URL (e.g., https://example.com)', 'url', 500));

                // Event delegation for attachment browse buttons

                    }

                document.getElementById('import-data-btn').addEventListener('click', () => document.getElementById('cards-import-file').click());
                document.getElementById('cards-import-file').addEventListener('change', (e) => this.importData(e));
                document.getElementById('load-topics-btn').addEventListener('click', () => document.getElementById('topics-import-file').click());
                document.getElementById('topics-import-file').addEventListener('change', (e) => this.loadTopics(e));
                document.getElementById('clear-all-btn').addEventListener('click', () => this.clearAll());

                // Filter/Sort panel toggle
                document.getElementById('toggle-filtersort-btn').addEventListener('click', () => {
                    document.getElementById('filtersort-section').classList.toggle('is-hidden');
                });

                // Apply Filter — snapshot DOM values into pendingFilter, show summary, enable Execute
                document.getElementById('apply-filter-btn').addEventListener('click', () => {
                    const mode     = document.getElementById('filter-mode').value;
                    const priority = document.getElementById('filter-priority').value;
                    const category = document.getElementById('filter-category').value;
                    const search   = document.getElementById('search-topic').value.trim();
                    this.pendingFilter = { mode, priority, category, search };
                    const parts = [];
                    if (mode)     parts.push('mode:' + mode);
                    if (priority) parts.push('priority:' + priority);
                    if (category) parts.push('category:' + category);
                    if (search)   parts.push('search:' + search);
                    document.getElementById('filter-scheme').textContent = parts.length ? parts.join(' · ') : '(all cards)';
                    this.setExecuteEnabled(true);
                });

                // Add sort field button
                document.getElementById('add-sort-field-btn').addEventListener('click', () => {
                    const select = document.getElementById('sort-field-select');
                    const field = select.value;
                    if (!field) { Toast.error('Please select a field to add'); return; }
                    if (this.sortFields.find(f => f.field === field)) { Toast.error('Field already in sort order'); return; }
                    const label = select.options[select.selectedIndex].text;
                    this.sortFields.push({ field, label });
                    select.value = '';
                    this.renderSortOrder();
                });

                // Clear sort staging — does not affect pendingSort or re-render
                document.getElementById('clear-sort-btn').addEventListener('click', () => {
                    this.sortFields = [];
                    this.renderSortOrder();
                    Toast.info('Sort staging cleared');
                });

                // Apply Sort — snapshot sortFields into pendingSort, show summary, enable Execute
                document.getElementById('apply-sort-btn').addEventListener('click', () => {
                    if (this.sortFields.length === 0) { Toast.error('Please add at least one sort field'); return; }
                    this.pendingSort = [...this.sortFields];
                    document.getElementById('sort-scheme').textContent = this.pendingSort.map(f => f.label).join(' → ');
                    this.setExecuteEnabled(true);
                });

                // Execute — apply committed filter+sort and re-render
                document.getElementById('execute-filtersort-btn').addEventListener('click', () => {
                    this.render();
                });

                // Clear — close the panel only; pending state is preserved
                document.getElementById('clear-filtersort-btn').addEventListener('click', () => {
                    document.getElementById('filtersort-section').classList.add('is-hidden');
                });

                // Restore button — clear all pending state, reset DOM, hide panel, re-render in default order
                document.getElementById('restore-btn').addEventListener('click', () => {
                    document.getElementById('filter-mode').value = '';
                    document.getElementById('filter-priority').value = '';
                    document.getElementById('filter-category').value = '';
                    document.getElementById('search-topic').value = '';
                    document.getElementById('filter-scheme').textContent = '';
                    document.getElementById('sort-scheme').textContent = '';
                    this.pendingFilter = null;
                    this.pendingSort = [];
                    this.sortFields = [];
                    this.renderSortOrder();
                    this.setExecuteEnabled(false);
                    document.getElementById('filtersort-section').classList.add('is-hidden');
                    this.render();
                    Toast.success('Filters and sort restored to default');
                });

                document.getElementById('toggle-layout').addEventListener('click', () => {
                    const button = document.getElementById('toggle-layout');
                    // Rotate: card-mode → line-mode → expand-mode → card-mode
                    // Icon/tooltip shows the NEXT state (what clicking will do)
                    if (this.layoutMode === 'card-mode') {
                        this.layoutMode = 'line-mode';
                        button.textContent = '□';
                        button.title = 'Switch to full-width expanded';
                    } else if (this.layoutMode === 'line-mode') {
                        this.layoutMode = 'expand-mode';
                        button.textContent = '⊞';
                        button.title = 'Switch to card grid';
                    } else {
                        this.layoutMode = 'card-mode';
                        button.textContent = '≡';
                        button.title = 'Switch to one card per line';
                    }
                    this.render();
                });
                
                document.getElementById('toggle-print').addEventListener('click', () => {
                    const printControls = document.getElementById('print-controls');
                    printControls.classList.toggle('is-hidden');
                });
                
                document.getElementById('toggle-bulk').addEventListener('click', () => {
                    const bulkControls = document.getElementById('bulk-controls');
                    bulkControls.classList.toggle('is-hidden');
                });

                document.getElementById('exit-app').addEventListener('click', () => this.exitApp());


                document.getElementById('close-print-controls').addEventListener('click', () => {
                    const printControls = document.getElementById('print-controls');
                    printControls.classList.add('is-hidden');
                });

                document.getElementById('close-bulk-controls').addEventListener('click', () => {
                    document.getElementById('bulk-controls').classList.add('is-hidden');
                });

                // Configure panel
                document.getElementById('configure').addEventListener('click', () => {
                    document.getElementById('configurations').classList.toggle('is-hidden');
                });
                document.getElementById('close-configurations').addEventListener('click', () => {
                    document.getElementById('configurations').classList.add('is-hidden');
                });
                document.getElementById('cfg-all-btn').addEventListener('click', () => {
                    document.querySelectorAll('#configurations input[type="checkbox"]').forEach(cb => cb.checked = true);
                });
                document.getElementById('cfg-none-btn').addEventListener('click', () => {
                    document.querySelectorAll('#configurations input[type="checkbox"]').forEach(cb => cb.checked = false);
                });
                document.getElementById('execute-configuration').addEventListener('click', () => {
                    const f = this.visibleFields;
                    f.description = document.getElementById('cfg-description').checked;
                    f.infoline    = document.getElementById('cfg-infoline').checked;
                    f.tags        = document.getElementById('cfg-tags').checked;
                    f.steps       = document.getElementById('cfg-steps').checked;
                    f.data        = document.getElementById('cfg-data').checked;
                    f.parent      = document.getElementById('cfg-parent').checked;
                    f.children    = document.getElementById('cfg-children').checked;
                    f.links       = document.getElementById('cfg-links').checked;
                    f.attachments = document.getElementById('cfg-attachments').checked;
                    f.recurrence  = document.getElementById('cfg-recurrence').checked;
                    this.render();
                    document.getElementById('configurations').classList.add('is-hidden');
                });

                // Description modal handlers
                document.getElementById('expand-description-btn').addEventListener('click', () => {
                    const modal = document.getElementById('description-modal');
                    const modalTextarea = document.getElementById('modal-description');
                    const description = this.safeGetElement('description').value;
                    
                    // Populate Note card dropdown
                    const noteSelect = document.getElementById('modal-note-select');
                    noteSelect.innerHTML = '<option value="">— select a Note card —</option>';
                    const noteCards = [...this.activeCards, ...this.completedCards]
                        .filter(c => c.mode === 'Note' && c.description);
                    noteCards.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.seqno;
                        opt.textContent = `#${c.seqno} ${c.topic}`;
                        noteSelect.appendChild(opt);
                    });

                    modalTextarea.value = description;
                    this.updateModalPreview();
                    modal.style.display = 'flex';
                });

                document.getElementById('modal-insert-note-btn').addEventListener('click', () => {
                    const noteSelect = document.getElementById('modal-note-select');
                    const seqno = parseInt(noteSelect.value);
                    if (!seqno) return;
                    const card = this.getCard(seqno);
                    if (!card || !card.description) return;

                    const textarea = document.getElementById('modal-description');
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const before = textarea.value.substring(0, start);
                    const after = textarea.value.substring(end);
                    // Add a newline separator if there's content before the insertion point
                    const separator = before.length > 0 && !before.endsWith('\n') ? '\n' : '';
                    textarea.value = before + separator + card.description + after;
                    // Place cursor after the inserted text
                    const newPos = before.length + separator.length + card.description.length;
                    textarea.selectionStart = newPos;
                    textarea.selectionEnd = newPos;
                    textarea.focus();
                    this.updateModalPreview();
                });

                document.getElementById('modal-close-btn').addEventListener('click', () => {
                    document.getElementById('description-modal').style.display = 'none';
                });

                document.getElementById('modal-cancel-btn').addEventListener('click', () => {
                    document.getElementById('description-modal').style.display = 'none';
                });

                document.getElementById('modal-save-btn').addEventListener('click', () => {
                    const modalTextarea = document.getElementById('modal-description');
                    this.safeGetElement('description').value = modalTextarea.value;
                    document.getElementById('description-modal').style.display = 'none';
                });

                // Update preview as user types
                document.getElementById('modal-description').addEventListener('input', () => {
                    this.updateModalPreview();
                });

                console.log('✓ Card click handlers managed via setupCardClickHandlers on each render');

                // EVENT DELEGATION for form remove buttons
                const cardForm = this.safeGetElement('card-form');
                if (cardForm) {
                    cardForm.addEventListener('click', (e) => {
                        if (e.target.classList.contains('btn-remove')) {
                            const arrayItem = e.target.closest('.array-item, .key-value-pair');
                            if (arrayItem) {
                                arrayItem.remove();
                                // Renumber steps if in steps container
                                if (arrayItem.closest('#steps-container')) {
                                    this.renumberSteps();
                                }
                            }
                        }
                    });
                    console.log('✓ Event delegation set up for form remove buttons');
                }

                // Undo / Redo buttons
                document.getElementById('undo-btn').addEventListener('click', () => { this.undo(); this.syncUndoRedoButtons(); });
                document.getElementById('redo-btn').addEventListener('click', () => { this.redo(); this.syncUndoRedoButtons(); });

                // Keyboard shortcuts: Ctrl+Z = undo, Ctrl+Y / Ctrl+Shift+Z = redo
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
                        if (e.key === 'z' && !e.shiftKey) {
                            // Avoid intercepting inside text inputs
                            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
                            e.preventDefault();
                            this.undo();
                            this.syncUndoRedoButtons();
                        } else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
                            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
                            e.preventDefault();
                            this.redo();
                            this.syncUndoRedoButtons();
                        }
                    }
                });
            }

            // Keep Undo / Redo buttons in sync with stack state
            syncUndoRedoButtons() {
                const undoBtn = document.getElementById('undo-btn');
                const redoBtn = document.getElementById('redo-btn');
                const canUndo = this.undoStack.length > 0;
                const canRedo = this.redoStack.length > 0;
                undoBtn.disabled      = !canUndo;
                undoBtn.style.opacity = canUndo ? '1' : '0.4';
                undoBtn.style.cursor  = canUndo ? 'pointer' : 'not-allowed';
                redoBtn.disabled      = !canRedo;
                redoBtn.style.opacity = canRedo ? '1' : '0.4';
                redoBtn.style.cursor  = canRedo ? 'pointer' : 'not-allowed';
            }

            updateModalPreview() {
                const modalTextarea = document.getElementById('modal-description');
                const preview = document.getElementById('modal-preview');
                preview.innerHTML = this.renderMarkdown(modalTextarea.value);
            }

            updateFieldVisibility() {
                // Simple: all fields visible for all modes (same as Task mode)
                // No mode-specific hiding or showing
            }

            // Close all slide-down panels toggled from the main controls bar
            closeControlPanels() {
                ['filtersort-section', 'print-controls', 'storage-controls', 'bulk-controls', 'configurations'].forEach(id => {
                    const el = document.getElementById(id);

            clearAndResetForm() {
                // Clear form fields
                this.safeGetElement('topic', true).value = '';
                this.safeGetElement('category', true).value = '';
                this.safeGetElement('description').value = '';
                this.clearArrayContainers();
                this.safeGetElement('parent').value = '';
                this.currentEditingSeqno = null;

                const now = new Date().toISOString().slice(0, 16);
                this.safeGetElement('starts-on').value = now;
                this.safeGetElement('ends-on').value = now;
                document.getElementById('created-on').value = now;

                // Reset mode and priority
                document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('btn-active'));
                const modeBtn = document.querySelector(`[data-mode="${this.selectedMode}"]`);
                if (modeBtn) modeBtn.classList.add('btn-active');

                document.querySelectorAll('[data-priority]').forEach(b => b.classList.remove('btn-active'));
                document.querySelector('[data-priority="Normal"]').classList.add('btn-active');
                this.selectedPriority = 'Normal';

                // Reset toggle buttons and hide all containers
                document.querySelectorAll('[data-toggle]').forEach(btn => btn.classList.remove('active'));
                document.getElementById('tags-container').classList.add('is-hidden');
                document.getElementById('steps-container').classList.add('is-hidden');
                document.getElementById('data-container').classList.add('is-hidden');
                document.getElementById('relationships-container').classList.add('is-hidden');
                document.getElementById('externals-container').classList.add('is-hidden');
                document.getElementById('recurrence-container').classList.add('is-hidden');

                this.updateCategoryDatalist();
                this.updateTagsDatalist();
                this.updateParentSelect();
                this.updateChildrenSelects();
                this.updateFieldVisibility();
                
                // Reset button text
                document.getElementById('save-card-btn').textContent = 'Save Card';
                document.getElementById('save-close-btn').textContent = 'Save & Close';
            }

            hideLeftPanel() {
                const panel = this.safeGetElement('panel-left');
                const container = document.querySelector('.container');
                const controlsContainer = document.getElementById('controls-container');
                
                panel.style.display = 'none';
                panel.classList.add('is-hidden');
                container.classList.remove('form-open');
                controlsContainer.classList.remove('form-open');
                // Cards display visible: all buttons shown except Display Cards
                document.getElementById('card-form-btn').style.display    = '';
                document.getElementById('cycle-view-btn').style.display   = '';
                document.getElementById('display-cards-btn').style.display = 'none';
                this.currentEditingSeqno = null;
            }

            editCard(seqno) {
                const card = this.getCard(seqno);
                if (!card) {
                    console.error('Card not found:', seqno);
                    return;
                }

                console.log('Editing card:', seqno, card);

                // First, show the panel with all the right classes
                const panel = this.safeGetElement('panel-left');
                const container = document.querySelector('.container');
                const controlsContainer = document.getElementById('controls-container');
                
                panel.style.display = 'block';
                panel.classList.remove('is-hidden');
                container.classList.add('form-open');
                controlsContainer.classList.add('form-open');
                // Form visible: only Display Cards button shown
                document.getElementById('card-form-btn').style.display    = 'none';
                document.getElementById('cycle-view-btn').style.display   = 'none';
                this._renumBtn.disabled     = true;
                this._renumBtn.style.opacity = '0.4';
                this._renumBtn.style.cursor  = 'not-allowed';
                document.getElementById('display-cards-btn').style.display = '';
                
                // Now populate the form with the card's data
                this.populateForm(card);
                
                // Set editing seqno
                this.currentEditingSeqno = seqno;
                
                // Change button text to Update Card
                document.getElementById('save-card-btn').textContent = 'Update Card';
                document.getElementById('save-close-btn').textContent = 'Update & Close';
                
                // Scroll to top
                panel.scrollTop = 0;
                
                console.log('Form should now be visible and populated');
