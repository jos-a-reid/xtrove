            getCardPrintHTML(card) {
                let html = `
                    <h1>Card #${card.seqno}</h1>
                    <div class="field"><span class="label">Mode:</span> ${card.mode}</div>
                    <div class="field"><span class="label">Topic:</span> ${this.escapeHtml(card.topic)}</div>
                `;

                if (card.description) html += `<div class="field"><span class="label">Description:</span> <div class="markdown-content">${this.renderMarkdown(card.description)}</div></div>`;
                if (card.category) html += `<div class="field"><span class="label">Category:</span> ${this.escapeHtml(card.category)}</div>`;
                html += `<div class="field"><span class="label">Priority:</span> ${card.priority}</div>`;
                if (card.startsOn) html += `<div class="field"><span class="label">Starts On:</span> ${this.formatDateTime(card.startsOn)}</div>`;
                if (card.endsOn) html += `<div class="field"><span class="label">Ends On:</span> ${this.formatDateTime(card.endsOn)}</div>`;
                
                if (card.tags.length > 0) {
                    html += `<div class="field"><span class="label">Tags:</span> ${card.tags.map(t => this.escapeHtml(t)).join(', ')}</div>`;
                }
                
                if (card.steps.length > 0) {
                    html += `<div class="field"><span class="label">Steps:</span><ol>`;
                    card.steps.forEach(step => html += `<li>${this.escapeHtml(step)}</li>`);
                    html += `</ol></div>`;
                }

                if (Object.keys(card.data).length > 0) {
                    html += `<div class="field"><span class="label">Data:</span><ul>`;
                    Object.entries(card.data).forEach(([k, v]) => {
                        html += `<li><strong>${this.escapeHtml(k)}:</strong> ${this.escapeHtml(v)}</li>`;
                    });
                    html += `</ul></div>`;
                }

                if (card.parent) html += `<div class="field"><span class="label">Parent:</span> ${this.escapeHtml(card.parent)}</div>`;
                
                if (card.children.length > 0) {
                    html += `<div class="field"><span class="label">Children:</span> ${card.children.map(c => this.escapeHtml(c)).join(', ')}</div>`;
                }

                if (card.links && card.links.length > 0) {
                    html += `<div class="field"><span class="label">Links:</span><ul>`;
                    card.links.forEach(link => html += `<li><a href="${this.escapeHtml(link)}" target="_blank">${this.escapeHtml(link)}</a></li>`);
                    html += `</ul></div>`;
                }

                if (card.attachments && card.attachments.length > 0) {
                    html += `<div class="field"><span class="label">Attachments:</span><ul>`;
                    card.attachments.forEach(att => html += `<li><a href="file:///${this.escapeHtml(att.replace(/\\/g, '/'))}" style="color: #059669; text-decoration: underline;">${this.escapeHtml(att)}</a></li>`);
                    html += `</ul></div>`;
                }

                if (card.recurrence && (card.recurrence.freq?.length > 0 || card.recurrence.days?.length > 0 || card.recurrence.period?.length > 0)) {
                    const parts = [];
                    if (card.recurrence.freq?.length > 0) parts.push(card.recurrence.freq.join(', '));
                    if (card.recurrence.days?.length > 0) parts.push(card.recurrence.days.join(', '));
                    if (card.recurrence.period?.length > 0) parts.push(card.recurrence.period.join(', '));
                    const recurrenceStr = parts.join(' ');
                    html += `<div class="field"><span class="label">Recurrence:</span> ${this.escapeHtml(recurrenceStr)}</div>`;
                }

                return html;
            }

            exportData() {

                        deletedCards:   this.deletedCards.map(c => c.toJSON()),
                        nextSeqno:      this.nextSeqno,
                        exportedAt:     new Date().toISOString()
                    };

                    const jsonString = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonString], { type: 'application/json' });

                    a.download = `card-manager-export-${Date.now()}.json`;
                    a.click();

            exportToCSV() {
                try {
                    const headers = [
                        'Seqno', 'Mode', 'Topic', 'Category', 'Priority', 'Status', 
                        'Starts', 'Ends', 'Description', 'Tags', 'Steps', 'Links', 
                        'Attachments', 'Parent', 'Children', 'Recurrence', 'Data'
                    ];
                    
                    const rows = this.activeCards.map(card => [
                        card.seqno,
                        card.mode,
                        card.topic,
                        card.category || '',
                        card.priority,
                        card.completed ? 'Complete' : 'Pending',
                        card.startsOn || '',
                        card.endsOn || '',
                        (card.description || '').replace(/"/g, '""'),
                        (card.tags || []).join('; '),
                        (card.steps || []).join('; '),
                        (card.links || []).join('; '),
                        (card.attachments || []).join('; '),
                        card.parent || '',
                        (card.children || []).join('; '),
                        this.formatRecurrenceForCSV(card.recurrence),
                        this.formatDataForCSV(card.data)
                    ]);
                    
                    const csv = [headers, ...rows]
                        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                        .join('\n');
                    
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `cards-export-${Date.now()}.csv`;
                    a.click();
                    URL.revokeObjectURL(url);
                    Toast.success(`Exported ${this.activeCards.length} active cards to CSV successfully`);
                } catch (error) {
                    console.error('CSV export error:', error);
                    Toast.error('Failed to export CSV: ' + error.message);
                }
            }

            formatRecurrenceForCSV(recurrence) {
                if (!recurrence) return '';
                const parts = [];
                if (recurrence.freq?.length) parts.push(recurrence.freq.join(','));
                if (recurrence.days?.length) parts.push(recurrence.days.join(','));
                if (recurrence.period?.length) parts.push(recurrence.period.join(','));
                return parts.join(' ');
            }

            formatDataForCSV(data) {
                if (!data || Object.keys(data).length === 0) return '';
                return Object.entries(data)
                    .map(([key, value]) => `${key}:${value}`)
                    .join('; ');
            }

            importData(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onerror = () => {
                    console.error('File read error:', reader.error);
                    Toast.error('Failed to read file');
                };
                
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        // Validate data structure — accept new format (activeCards) or legacy (cards)
                        if (!data || (!Array.isArray(data.activeCards) && !Array.isArray(data.cards))) {
                            throw new Error('Invalid data format: missing cards array');
                        }
                        
                        if (confirm('This will replace all existing data. Continue?')) {
                            // Clear all existing cards
                            this.activeCards = [];
                            this.completedCards = [];
                            this.deletedCards = [];
                            
                            // Import cards — reassign seqnos sequentially to guarantee valid integer keys
                            let importSeqno = 1;

                            if (Array.isArray(data.activeCards)) {
                                // New format: restore all three arrays preserving completed/deleted status
                                data.activeCards.forEach(cardData => {
                                    const card = new Card(cardData);
                                    card.seqno = importSeqno++;
                                    this.activeCards.push(card);
                                });
                                (data.completedCards || []).forEach(cardData => {
                                    const card = new Card(cardData);
                                    card.seqno = importSeqno++;
                                    this.completedCards.push(card);
                                });
                                (data.deletedCards || []).forEach(cardData => {
                                    const card = new Card(cardData);
                                    card.seqno = importSeqno++;
                                    this.deletedCards.push(card);
                                });
                            } else {
                                // Legacy format: single cards array — all go to activeCards
                                data.cards.forEach(cardData => {
                                    const card = new Card(cardData);
                                    card.seqno = importSeqno++;
                                    this.activeCards.push(card);
                                });
                            }
                            
                            this.nextSeqno = importSeqno;
                            this._categoriesDirty = true;
                            this.debouncedSave();
                            this.render();
                            Toast.success('Data imported successfully');
                        }
                    } catch (error) {
                        console.error('Import error:', error);
                        Toast.error('Error importing data: ' + error.message);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            clearAll() {
                const totalCards = this.activeCards.length + this.completedCards.length + this.deletedCards.length;
                
                if (totalCards === 0) {
                    Toast.info('No cards to clear');
                    return;
                }

                const confirmMessage = `Are you sure you want to delete ALL ${totalCards} card${totalCards !== 1 ? 's' : ''}?\n\nThis includes active, completed, and deleted cards.\n\nThis action cannot be undone!`;
                
                if (confirm(confirmMessage)) {
                    // Double confirmation for safety
                    if (confirm('Really delete everything? This is permanent!')) {
                        this.activeCards = [];
                        this.completedCards = [];
                        this.deletedCards = [];
                        this.nextSeqno = 1;
                        this._categoriesDirty = true;
                        this.debouncedSave();
                        this.render();
                        this.hideLeftPanel();
                        Toast.success(`All ${totalCards} card${totalCards !== 1 ? 's' : ''} deleted permanently`);
                    }
                }
            }

            loadTopics(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        // Split by newlines and filter out empty lines
                        const topics = text.split(/\r?\n/)
                            .map(line => line.trim())
                            .filter(line => line.length > 0);

                        if (topics.length === 0) {
                            Toast.error('No topics found in file');
                            return;
                        }

                        const confirmMessage = `Load ${topics.length} topic${topics.length !== 1 ? 's' : ''} as Task cards?\n\nThis will add to existing cards.`;
                        
                        if (confirm(confirmMessage)) {
                            let successCount = 0;
                            const now = new Date().toISOString().slice(0, 16);

                            // Temporarily suppress per-card saves; batch after loop
                            const _orig = this.saveToStorage.bind(this);
                            const _noop = () => Promise.resolve();
                            this.saveToStorage = _noop;

                            topics.forEach(topic => {
                                try {
                                    const cardData = {
                                        mode: 'Task',
                                        topic: topic,
                                        category: '',
                                        priority: 'Normal',
                                        startsOn: now,
                                        endsOn: now,
                                        description: '',
                                        tags: [],
                                        steps: [],
                                        data: {},
                                        parent: '',
                                        children: []
                                    };
                                    this.createCard(cardData); // handles seqno, recordAction, push
                                    successCount++;
                                } catch (error) {
                                    console.error(`Error creating card for topic: ${topic}`, error);
                                }
                            });

                            // Restore save and flush once
                            this.saveToStorage = _orig;
                            this.debouncedSave();
                            this.render();
                            Toast.success(`Loaded ${successCount} topic${successCount !== 1 ? 's' : ''} as Task cards`);
                        }
                    } catch (error) {
                        Toast.error('Error reading topics file: ' + error.message);
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; // Reset file input
            }

            formatDateTime(dateString) {
                const date = new Date(dateString);
                
                // Get date components
                const year = String(date.getFullYear()).slice(-2); // Last 2 digits of year
                const month = String(date.getMonth() + 1).padStart(2, '0'); // Month (01-12)
                const day = String(date.getDate()).padStart(2, '0'); // Day (01-31)
                
                // Get time components
                const hours = String(date.getHours()).padStart(2, '0'); // Hours (00-23)
                const minutes = String(date.getMinutes()).padStart(2, '0'); // Minutes (00-59)
                
                // Format: yymmdd hh:mm
                return `${year}${month}${day} ${hours}:${minutes}`;
            }

            // Shared time-breakdown helper — returns a human-readable string for a positive ms delta
            _timeDiff(diffMs) {
                const diffMins   = Math.floor(diffMs / 60000);
                const diffHours  = Math.floor(diffMins  / 60);
                const diffDays   = Math.floor(diffHours / 24);
                const diffWeeks  = Math.floor(diffDays  / 7);
                const diffMonths = Math.floor(diffDays  / 30);
                const diffYears  = Math.floor(diffDays  / 365);
                if (diffYears > 0) {
                    const mo = Math.floor((diffDays % 365) / 30);
                    return mo > 0 ? `${diffYears}y ${mo}mo` : `${diffYears}y`;
                } else if (diffMonths > 0) {
                    const d = diffDays % 30;
                    return d > 0 ? `${diffMonths}mo ${d}d` : `${diffMonths}mo`;
                } else if (diffWeeks > 0) {
                    const d = diffDays % 7;
                    return d > 0 ? `${diffWeeks}w ${d}d` : `${diffWeeks}w`;
                } else if (diffDays > 0) {
                    const h = diffHours % 24;
                    return h > 0 ? `${diffDays}d ${h}h` : `${diffDays}d`;
                } else if (diffHours > 0) {
                    const m = diffMins % 60;
                    return m > 0 ? `${diffHours}h ${m}m` : `${diffHours}h`;
                } else {
                    return `${diffMins}m`;
                }
            }

            calculateDuration(startsOn, endsOn) {
                const diffMs = new Date(endsOn) - new Date(startsOn);
                return diffMs < 0 ? '0m' : this._timeDiff(diffMs);
            }

            calculateTimeRemaining(endsOn) {
                const diffMs = new Date(endsOn) - new Date();
                return diffMs < 0 ? 'overdue' : this._timeDiff(diffMs);
            }

            getRemainingColor(startsOn, endsOn) {
                const now = new Date();
                const start = new Date(startsOn);
                const end = new Date(endsOn);
                
                const totalDuration = end - start;
                const timeRemaining = end - now;
                
                // If overdue
                if (timeRemaining < 0) {
                    return '#ef4444'; // red
                }
                
                // If less than half the duration remains
                if (timeRemaining < totalDuration / 2) {
                    return '#f59e0b'; // amber/warning color
                }
                
                // More than half remains
                return '#059669'; // green
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            renderMarkdown(text) {
                if (!text) return '';
                try {
                    return marked.parse(text);
                } catch (error) {
                    console.error('Error rendering markdown:', error);
                    return this.escapeHtml(text);
                }
            }

            toggleDescription(seqno, buttonElement) {
                const descriptionDiv = document.getElementById(`desc-${seqno}`);
                const isExpanded = descriptionDiv.classList.contains('desc-expanded');
                
                if (isExpanded) {
                    // Collapse - show 2 lines
                    descriptionDiv.classList.remove('desc-expanded');
                    descriptionDiv.classList.add('desc-truncated');
                    buttonElement.textContent = '+';
                } else {
                    // Expand - show all
                    descriptionDiv.classList.remove('desc-truncated');
                    descriptionDiv.classList.add('desc-expanded');
                    buttonElement.textContent = '−';
                }
            }
        }

        let cardManager;
        window.addEventListener('DOMContentLoaded', () => {
            cardManager = new CardManager();

            // Check for URL parameter to auto-open form with specific mode
            const urlParams = new URLSearchParams(window.location.search);
            const modeParam = urlParams.get('mode') || urlParams.keys().next().value;
            
            if (modeParam) {
                const validModes = ['Task', 'Note', 'Data', 'List'];
                // Case-insensitive match
                const mode = validModes.find(m => m.toLowerCase() === modeParam.toLowerCase());
                
                if (mode) {
                    // Set the mode and open the form immediately
                    cardManager.selectedMode = mode;
                    cardManager.showLeftPanel();
                    cardManager.clearAndResetForm();
                    // Update the active mode button
                    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('btn-active'));
                    const modeBtn = document.querySelector(`[data-mode="${mode}"]`);
                    if (modeBtn) modeBtn.classList.add('btn-active');
                    cardManager.updateFieldVisibility();
                    cardManager.updateCategoryDatalist();
                    cardManager.updateTagsDatalist();
                }
            }
        });
    </script>

    <!-- Description Modal -->
    <div id="description-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000; justify-content:center; align-items:flex-start; overflow-y:auto; padding:40px 0;">
        <div style="background:white; width:90%; max-width:800px; border-radius:8px; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.3); margin:auto;">
            <div style="padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0; font-size:18px; font-weight:600; color:#1f2937;">Edit Description</h2>
                <button id="modal-close-btn" style="width:32px; height:32px; border:none; background:#f3f4f6; border-radius:4px; cursor:pointer; font-size:18px; color:#6b7280;">✕</button>
            </div>
            <div style="padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <label style="font-size:13px; color:#6b7280;">Insert from Note:</label>
                <select id="modal-note-select" style="flex:1; min-width:200px; padding:6px 8px; border:1px solid #d1d5db; border-radius:4px; font-size:13px;"></select>
                <button id="modal-insert-note-btn" class="btn-standard btn-secondary" style="white-space:nowrap;">Insert at cursor</button>
            </div>
            <div style="padding:16px 20px; display:flex; gap:16px; flex:1;">
                <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <label style="font-size:13px; font-weight:500; color:#374151;">Source</label>
                    <textarea id="modal-description" maxlength="5000" style="flex:1; width:100%; min-height:350px; padding:10px; border:1px solid #d1d5db; border-radius:4px; font-size:13px; font-family:inherit; resize:vertical; box-sizing:border-box;"></textarea>
                </div>
                <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <label style="font-size:13px; font-weight:500; color:#374151;">Preview</label>
                    <div id="modal-preview" style="flex:1; min-height:350px; padding:10px; border:1px solid #e5e7eb; border-radius:4px; font-size:13px; overflow-y:auto; background:#fafafa;"></div>
                </div>
            </div>
            <div style="padding:16px 20px; border-top:1px solid #e5e7eb; display:flex; justify-content:flex-end; gap:10px;">
                <button id="modal-cancel-btn" class="btn-standard btn-secondary">Cancel</button>
                <button id="modal-save-btn" class="btn-standard btn-primary">Save</button>
            </div>
        </div>
    </div>
</body>
