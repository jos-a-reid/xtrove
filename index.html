            clearArrayContainers() {
                document.getElementById('tags-items').innerHTML = '<div class="array-item"><input type="text" class="input-text tag-input-autocomplete" maxlength="30" placeholder="Enter tag" list="tags-datalist"></div>';
                document.getElementById('steps-items').innerHTML = '';
                this.addArrayInput('steps-items', '', true);
                document.getElementById('data-items').innerHTML = '<div class="key-value-pair"><input type="text" class="input-text" maxlength="30" placeholder="Key"><input type="text" class="input-text" maxlength="80" placeholder="Value (max 80 chars)"></div>';
                document.getElementById('children-container').innerHTML = '';
                this.addChildSelect();
                document.getElementById('links-items').innerHTML = '<div class="array-item"><input type="url" class="input-text" maxlength="500" placeholder="Enter URL (e.g., https://example.com)"></div>';
                document.getElementById('attachments-items').innerHTML = '<div class="array-item"><input type="text" class="input-text" maxlength="500" placeholder="Enter file path (e.g., /path/to/file.pdf)"></div>';
                
                // Clear recurrence - uncheck all checkboxes
                document.querySelectorAll('input[name="recurrence-freq"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="recurrence-day"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="recurrence-period"]').forEach(cb => cb.checked = false);
                this.updateRecurrenceString();
                
                this.updateChildrenSelects();
            }

            populateForm(card) {
                document.getElementById('card-seqno').value = card.seqno;
                this.safeGetElement('topic', true).value = card.topic;
                this.safeGetElement('category', true).value = card.category;
                this.safeGetElement('starts-on').value = card.startsOn;
                this.safeGetElement('ends-on').value = card.endsOn;
                this.safeGetElement('description').value = card.description || '';

                // Set mode
                document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('btn-active'));
                const modeBtn = document.querySelector(`[data-mode="${card.mode}"]`);
                if (modeBtn) {
                    modeBtn.classList.add('btn-active');
                    this.selectedMode = card.mode;
                    this.updateCategoryDatalist();  // Update categories for card's mode
                    this.updateTagsDatalist();  // Update tags for card's mode
                }

                // Set priority
                document.querySelectorAll('[data-priority]').forEach(b => b.classList.remove('btn-active'));
                const priorityBtn = document.querySelector(`[data-priority="${card.priority}"]`);
                if (priorityBtn) {
                    priorityBtn.classList.add('btn-active');
                    this.selectedPriority = card.priority;
                }

                const tagsContainer = document.getElementById('tags-items');
                tagsContainer.innerHTML = '';
                if (card.tags.length > 0) {
                    // Show tags container if there are tags
                    document.getElementById('tags-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="tags-container"]').classList.add('active');
                    
                    // Sort tags alphabetically when loading into form
                    const sortedTags = [...card.tags].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                    sortedTags.forEach(tag => this.addArrayInput('tags-items', tag));
                } else {
                    this.addArrayInput('tags-items', '', true);
                }

                const stepsContainer = document.getElementById('steps-items');
                stepsContainer.innerHTML = '';
                if (card.steps.length > 0) {
                    // Show steps container if there are steps
                    document.getElementById('steps-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="steps-container"]').classList.add('active');
                    
                    card.steps.forEach(step => {
                        const div = document.createElement('div');
                        div.className = 'array-item';
                        
                        // Add drag handle
                        const dragHandle = document.createElement('span');
                        dragHandle.className = 'drag-handle';
                        dragHandle.innerHTML = '⋮⋮';
                        dragHandle.title = 'Drag to reorder';
                        div.appendChild(dragHandle);
                        
                        const numberSpan = document.createElement('span');
                        numberSpan.className = 'step-number';
                        numberSpan.style.cssText = 'font-weight: 600; color: #14b8a6; margin-right: 8px; min-width: 20px;';
                        div.appendChild(numberSpan);
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'input-text';
                        input.maxLength = CardManager.CONFIG.LIMITS.TAG_MAX_LENGTH;
                        input.value = step;
                        div.appendChild(input);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'btn-remove';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => {
                            div.remove();
                            this.renumberSteps();
                        });
                        div.appendChild(removeBtn);
                        
                        stepsContainer.appendChild(div);
                        this.makeDraggable(div, () => this.renumberSteps());
                    });
                    this.renumberSteps();
                } else {
                    this.addArrayInput('steps-items', '', true);
                }

                const dataContainer = document.getElementById('data-items');
                if (dataContainer) {
                    dataContainer.innerHTML = '';
                }
                const dataEntries = Object.entries(card.data);
                if (dataEntries.length > 0) {
                    // Show data container if there is data
                    document.getElementById('data-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="data-container"]').classList.add('active');
                    
                    dataEntries.forEach(([key, value]) => {
                        const div = document.createElement('div');
                        div.className = 'key-value-pair';
                        
                        // Add drag handle
                        const dragHandle = document.createElement('span');
                        dragHandle.className = 'drag-handle';
                        dragHandle.innerHTML = '⋮⋮';
                        dragHandle.title = 'Drag to reorder';
                        div.appendChild(dragHandle);
                        
                        const keyInput = document.createElement('input');
                        keyInput.type = 'text';
                        keyInput.className = 'input-text';
                        keyInput.maxLength = CardManager.CONFIG.LIMITS.CATEGORY_MAX_LENGTH;
                        keyInput.value = key;
                        div.appendChild(keyInput);
                        
                        const valueInput = document.createElement('input');
                        valueInput.type = 'text';
                        valueInput.className = 'input-text';
                        valueInput.maxLength = CardManager.CONFIG.LIMITS.VALUE_MAX_LENGTH;
                        valueInput.value = value;
                        div.appendChild(valueInput);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'btn-remove';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => div.remove());
                        div.appendChild(removeBtn);
                        
                        if (dataContainer) {
                            dataContainer.appendChild(div);
                            this.makeDraggable(div);
                        }
                    });
                }

                this.safeGetElement('parent').value = card.parent || '';

                const childrenContainer = document.getElementById('children-container');
                childrenContainer.innerHTML = '';
                if (card.children.length > 0 || card.parent) {
                    // Show relationships container if there are relationships
                    document.getElementById('relationships-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="relationships-container"]').classList.add('active');
                }
                
                if (card.children.length > 0) {
                    card.children.forEach(child => {
                        const select = document.createElement('select');
                        select.className = 'input-select';
                        this.populateTopicSelect(select);
                        select.value = child;
                        
                        const wrapper = document.createElement('div');
                        wrapper.className = 'array-item';
                        wrapper.appendChild(select);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'btn-remove';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => wrapper.remove());
                        wrapper.appendChild(removeBtn);
                        
                        childrenContainer.appendChild(wrapper);
                    });
                } else {
                    this.addChildSelect();
                }

                // Populate links
                const linksContainer = document.getElementById('links-items');
                linksContainer.innerHTML = '';
                if (card.links && card.links.length > 0) {
                    document.getElementById('externals-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="externals-container"]').classList.add('active');
                    
                    card.links.forEach(link => {
                        const input = document.createElement('input');
                        input.type = 'url';
                        input.className = 'input-text';
                        input.maxLength = CardManager.CONFIG.LIMITS.LINK_MAX_LENGTH;
                        input.value = link;
                        input.placeholder = 'Enter URL (e.g., https://example.com)';
                        
                        const div = document.createElement('div');
                        div.className = 'array-item';
                        div.appendChild(input);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'btn-remove';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => div.remove());
                        div.appendChild(removeBtn);
                        
                        linksContainer.appendChild(div);
                    });
                }

                // Populate attachments
                const attachmentsContainer = document.getElementById('attachments-items');
                attachmentsContainer.innerHTML = '';
                if (card.attachments && card.attachments.length > 0) {
                    document.getElementById('externals-container').classList.remove('is-hidden');
                    document.querySelector('[data-toggle="externals-container"]').classList.add('active');
                    
                    card.attachments.forEach(attachment => {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'input-text';
                        input.maxLength = CardManager.CONFIG.LIMITS.LINK_MAX_LENGTH;
                        input.value = attachment;
                        input.placeholder = 'Enter file path (e.g., /path/to/file.pdf)';
                        
                        const div = document.createElement('div');
                        div.className = 'array-item';
                        div.appendChild(input);
                        
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'btn-remove';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => div.remove());
                        div.appendChild(removeBtn);
                        
                        attachmentsContainer.appendChild(div);
                    });
                }

                // Populate recurrence
                // First, uncheck all
                document.querySelectorAll('input[name="recurrence-freq"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="recurrence-day"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="recurrence-period"]').forEach(cb => cb.checked = false);
                
                // Then check the ones in the card data
                if (card.recurrence) {

            makeDraggable(element, onDrop = null) {
                element.setAttribute('draggable', 'true');

                element.addEventListener('dragstart', (e) => {
                    this.draggedElement = element;
                    element.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/html', element.innerHTML);
                });

                element.addEventListener('dragend', (e) => {
                    element.classList.remove('dragging');
                    // Remove all drag-over classes
                    document.querySelectorAll('.drag-over').forEach(el => {
                        el.classList.remove('drag-over');
                    });
                    this.draggedElement = null;
                });

                element.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';

                    if (this.draggedElement && element !== this.draggedElement) {
                        element.classList.add('drag-over');
                    }
                });

                element.addEventListener('dragleave', (e) => {
                    element.classList.remove('drag-over');
                });

                element.addEventListener('drop', (e) => {
                    e.preventDefault();
                    element.classList.remove('drag-over');

                    if (this.draggedElement && element !== this.draggedElement) {
                        // Get the container
                        const container = element.parentNode;
                        const allItems = Array.from(container.children);
                        const draggedIndex = allItems.indexOf(this.draggedElement);
                        const targetIndex = allItems.indexOf(element);

                        // Reorder the elements
                        if (draggedIndex < targetIndex) {
                            element.parentNode.insertBefore(this.draggedElement, element.nextSibling);
                        } else {
                            element.parentNode.insertBefore(this.draggedElement, element);
                        }

                        if (onDrop) onDrop();
                    }
                });
            }

            async openFilePicker(browseBtn) {
                // Create a hidden file input
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*,.pdf'; // Accept images and PDFs
                fileInput.style.display = 'none';
                
                fileInput.addEventListener('change', async (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const file = e.target.files[0];
                        const textInput = browseBtn.parentElement.querySelector('.attachment-path-input');
                        
                        try {
                            // Store file in IndexedDB
                            const fileId = await this.storeFile(file);
                            
                            if (textInput) {
                                // Store file ID with metadata
                                textInput.value = `file:${fileId}`;
                                textInput.dataset.fileId = fileId;
                                textInput.dataset.fileName = file.name;
                                textInput.dataset.fileType = file.type;
                                
                                // Display preview for images
                                await this.displayFilePreview(fileId, file, browseBtn.parentElement);
                            }
                            
                            Toast.success(`File "${file.name}" uploaded successfully`);
                        } catch (error) {
                            console.error('Error storing file:', error);
                            Toast.error('Failed to upload file');
                        }
                    }
                    // Clean up the file input
                    fileInput.remove();
                });
                
                // Trigger the file picker
                document.body.appendChild(fileInput);
                fileInput.click();
            }

            async storeFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const fileId = Date.now() + '_' + Math.random().toString(36).slice(2);
                            const fileData = {
                                id:         fileId,
                                name:       file.name,
                                type:       file.type,
                                size:       file.size,
                                data:       e.target.result,
                                uploadDate: new Date().toISOString()
                            };
                            await DB.put('files', fileData);
                            resolve(fileId);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.onerror = () => reject(reader.error);
                    reader.readAsDataURL(file);
                });
            }

            async displayFilePreview(fileId, file, containerElement) {
                // Remove any existing preview
                const existingPreview = containerElement.querySelector('.file-preview');
                if (existingPreview) {
                    existingPreview.remove();
                }
                
                const preview = document.createElement('div');
                preview.className = 'file-preview';
                preview.style.cssText = 'margin-top: 8px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 4px; background: #f9fafb;';
                
                // For images, show thumbnail
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.style.cssText = 'max-width: 200px; max-height: 200px; display: block; border-radius: 4px;';
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                    
                    preview.appendChild(img);
                }
                // For PDFs, show icon and name
                else if (file.type === 'application/pdf') {
                    preview.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 24px;">📄</span>
                            <span style="font-size: 12px; color: #4b5563;">${this.escapeHtml(file.name)} (${this.formatFileSize(file.size)})</span>
                        </div>
                    `;
                }
                
                containerElement.appendChild(preview);
            }

            formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            updateRecurrenceString() {
                // Get selected values from each set
                const freqCheckboxes = document.querySelectorAll('input[name="recurrence-freq"]:checked');
                const dayCheckboxes = document.querySelectorAll('input[name="recurrence-day"]:checked');
                const periodCheckboxes = document.querySelectorAll('input[name="recurrence-period"]:checked');
                
                const freq = Array.from(freqCheckboxes).map(cb => cb.value).join(', ');
                const days = Array.from(dayCheckboxes).map(cb => cb.value).join(', ');
                const period = Array.from(periodCheckboxes).map(cb => cb.value).join(', ');
                
                // Build recurrence string
                const parts = [];
                if (freq) parts.push(freq);
                if (days) parts.push(days);
                if (period) parts.push(period);
                
                const recurrenceStr = parts.join(' ');
                const displayEl = document.getElementById('recurrence-display');
                
                if (recurrenceStr) {
                    displayEl.innerHTML = recurrenceStr;
                    displayEl.style.color = '#374151';
                } else {
                    displayEl.innerHTML = '<span style="color: #9ca3af;">No recurrence pattern selected</span>';
                }
            }

            handleFormSubmit(e) {
                // Validate form first
                if (!this.validateForm()) {
                    return false; // Don't submit if validation fails
                }
                
                try {
                    const description = this.safeGetElement('description').value.trim();
                    let topic = this.safeGetElement('topic', true).value.trim();
                    let category = this.safeGetElement('category', true).value.trim();
                    
                    // Check if '::' appears in the description
                    const topicMarkerIndex = description.indexOf('::');
                    if (topicMarkerIndex !== -1) {
                        // Extract topic from description (everything before '::')
                        topic = description.substring(0, topicMarkerIndex).trim();
                        // Strip leading # characters
                        topic = topic.replace(/^#+\s*/, '');
                        // Update the topic field visually
                        this.safeGetElement('topic', true).value = topic;
                    }
                    
                    // Check for category enclosed in square brackets [category]
                    const categoryMatch = description.match(/\[([^\]]+)\]/);
                    if (categoryMatch) {
                        // Extract category from the first match
                        category = categoryMatch[1].trim();
                        // Update the category field visually
                        this.safeGetElement('category', true).value = category;
                    }
                    
                    // Use createdOn for Note/Data/List modes, startsOn for others
                    let startsOn, endsOn;
                    if (this.selectedMode === 'Note' || this.selectedMode === 'Data' || this.selectedMode === 'List') {
                        startsOn = document.getElementById('created-on').value;
                        endsOn = ''; // No end date for these modes
                    } else {
                        startsOn = this.safeGetElement('starts-on').value;
                        endsOn = this.safeGetElement('ends-on').value;
                    }

                    const tags = Array.from(document.querySelectorAll('#tags-items input'))
                        .map(input => input.value.trim())
                        .filter(val => val.length > 0)
                        .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase())); // Sort alphabetically

                    const steps = Array.from(document.querySelectorAll('#steps-items input'))
                        .map(input => input.value.trim())
                        .filter(val => val.length > 0);

                    const dataObj = {};
                    document.querySelectorAll('#data-container .key-value-pair').forEach(pair => {
                        const inputs = pair.querySelectorAll('input');
                        const key = inputs[0].value.trim();
                        const value = inputs[1].value.trim();
                        if (key && value) {
                            dataObj[key] = value;
                        }
                    });

                    const parent = this.safeGetElement('parent').value;

                    const children = Array.from(document.querySelectorAll('#children-container select'))
                        .map(select => select.value)
                        .filter(val => val.length > 0);

                    const links = Array.from(document.querySelectorAll('#links-items input'))
                        .map(input => input.value.trim())
                        .filter(val => val.length > 0);

                    const attachments = Array.from(document.querySelectorAll('#attachments-items input'))
                        .map(input => input.value.trim())
                        .filter(val => val.length > 0);

                    // Collect recurrence data from three sets
                    const freqCheckboxes = document.querySelectorAll('input[name="recurrence-freq"]:checked');
                    const dayCheckboxes = document.querySelectorAll('input[name="recurrence-day"]:checked');
                    const periodCheckboxes = document.querySelectorAll('input[name="recurrence-period"]:checked');
                    
                    const recurrence = {
                        freq: Array.from(freqCheckboxes).map(cb => cb.value),
                        days: Array.from(dayCheckboxes).map(cb => cb.value),
                        period: Array.from(periodCheckboxes).map(cb => cb.value)
                    };

                    const cardData = {
                        mode: this.selectedMode,
                        topic,
                        category,
                        priority: this.selectedPriority,
                        startsOn,
                        endsOn,
                        description,
                        tags,
                        steps,
                        data: dataObj,
                        links,
                        attachments,
                        recurrence,
                        parent,
                        children
                    };

                    if (this.currentEditingSeqno) {
                        this.updateCard(this.currentEditingSeqno, cardData);
                        Toast.success('Card updated successfully');
                    } else {
                        this.createCard(cardData);
                        Toast.success('Card created successfully');
                    }

                    // Keep form open but reset fields, maintaining the current mode
                    const currentMode = this.selectedMode;
                    
                    // Clear form fields
                    this.safeGetElement('topic', true).value = '';
                    this.safeGetElement('category', true).value = '';
                    this.safeGetElement('description').value = '';
                    this.clearArrayContainers();
                    this.currentEditingSeqno = null;

                    const now = new Date().toISOString().slice(0, 16);
                    this.safeGetElement('starts-on').value = now;
                    this.safeGetElement('ends-on').value = now;
                    document.getElementById('created-on').value = now;

                    // Keep the same mode
                    this.selectedMode = currentMode;
                    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('btn-active'));
                    const modeBtn = document.querySelector(`[data-mode="${currentMode}"]`);
                    if (modeBtn) modeBtn.classList.add('btn-active');

                    // Reset priority to Normal
                    document.querySelectorAll('[data-priority]').forEach(b => b.classList.remove('btn-active'));
                    document.querySelector('[data-priority="Normal"]').classList.add('btn-active');
                    this.selectedPriority = 'Normal';

                    // Reset toggle buttons and hide all containers
                    document.querySelectorAll('[data-toggle]').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('tags-container').classList.add('is-hidden');
                    document.getElementById('steps-container').classList.add('is-hidden');
                    document.getElementById('data-container').classList.add('is-hidden');
                    document.getElementById('relationships-container').classList.add('is-hidden');
                    document.getElementById('externals-container').classList.add('is-hidden');
                    document.getElementById('recurrence-container').classList.add('is-hidden');

                    this.updateCategoryDatalist();
                    this.updateTagsDatalist();
                    this.updateParentSelect();
                    this.updateChildrenSelects();
                    this.updateFieldVisibility();
                    
                    // Update save button text back to "Save Card"
                    document.getElementById('save-card-btn').textContent = 'Save Card';
                    document.getElementById('save-close-btn').textContent = 'Save & Close';
                    
                    // Scroll to top of form
                    const panel = this.safeGetElement('panel-left');
                    panel.scrollTop = 0;
                    return true;
                } catch (error) {
                    Toast.error('Error: ' + error.message);
                    return false;
                }
            }

            renderCard(card) {
                // Check if we're in line-mode
                if (this.layoutMode === 'line-mode') {
                    return this.renderCardLineMode(card);
                }
                
                // In expand-mode, force description fully expanded and suppress expand button
                const expandMode = this.layoutMode === 'expand-mode';
                const div = document.createElement('div');
                const completedClass = card.completed ? ' completed' : '';
                div.className = `card priority-${card.priority.toLowerCase()}${completedClass}`;
                div.dataset.seqno = card.seqno; // Add seqno for event delegation
                
                // Check if this is a Note card for special formatting
                if (card.mode === 'Note' && !expandMode) {
                    // SPECIAL FORMAT FOR NOTE CARDS
                    let html = `
                        <div class="card-header">
                            <div style="display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 3px;">
                                    <input type="checkbox" class="card-checkbox" data-seqno="${card.seqno}" style="cursor: pointer; margin: 0;">
                                    <span class="card-seqno">#${card.seqno}</span>
                                </div>
                                <h3 class="card-topic" style="margin: 0; flex: 1; min-width: 200px;">${this.escapeHtml(card.topic)}</h3>
                            </div>
                        </div>
                    `;

                    // Line 2: Compact info line
                    html += this.renderInfoLine(card);

                    // Line 3: Description
                    if (card.description && this.visibleFields.description) {
                        
                        html += `
                            <div class="card-field" style="position: relative;">
                                <div class="card-field-value markdown-content desc-truncated" id="${descriptionId}" data-full-desc="${this.escapeHtml(card.description)}">
                                    ${this.renderMarkdown(card.description)}
                                </div>
                                <button class="btn-expand-desc" onclick="cardManager.toggleDescription(${card.seqno}, this)" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; font-size: 16px; background: rgba(255, 255, 255, 0.9); border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; color: #6b7280; display: flex; align-items: center; justify-content: center; font-weight: bold;" title="Expand/Collapse">
                                    +
                                </button>
                            </div>
                        `;
                    }

                    // Tags display
                    html += this.renderTags(card.tags);

                    // Parent and Children display
                    html += this.renderParentChild(card);

                    // Links display
                    html += this.renderLinks(card.links);

                    html += this.renderAttachments(card.attachments, card.seqno);

                    // Recurrence display
                    html += this.renderRecurrence(card.recurrence);

                    html += this.renderCardActionBar(card);

                    div.innerHTML = html;
                    return div;
                }
                
                // Check if this is a Data card for special formatting
                if (card.mode === 'Data' && !expandMode) {
                    // SPECIAL FORMAT FOR DATA CARDS
                    let html = `
                        <div class="card-header">
                            <div style="display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 3px;">
                                    <input type="checkbox" class="card-checkbox" data-seqno="${card.seqno}" style="cursor: pointer; margin: 0;">
                                    <span class="card-seqno">#${card.seqno}</span>
                                </div>
                                <h3 class="card-topic" style="margin: 0; flex: 1; min-width: 200px;">${this.escapeHtml(card.topic)}</h3>
                            </div>
                        </div>
                    `;

                    // Line 2: Compact info line
                    html += this.renderInfoLine(card);

                    // Line 3: Data section with indented key-value pairs
                    if (card.data && Object.keys(card.data).length > 0 && this.visibleFields.data) {
                        html += `
                            <div class="card-field">
                                <span class="card-field-label">data:</span>
                                <div style="margin-left: 20px; margin-top: 8px;">
                        `;
                        
                        Object.entries(card.data).forEach(([key, value]) => {
                            html += `
                                <div style="margin-bottom: 4px; font-size: 12px;">
                                    <span style="font-weight: 600; color: #0d9488;">${this.escapeHtml(key)}:</span>
                                    <span style="color: #374151; margin-left: 8px;">${this.escapeHtml(value)}</span>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    }

                    // Line 4: Tags (inline, no label wrapping)
                    if (card.tags && card.tags.length > 0 && this.visibleFields.tags) {
                        const sortedTags = [...card.tags].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                        html += `
                            <div class="card-field">
                                <span class="card-field-label">tags:</span>
                                <span class="card-field-value" style="margin-left: 8px;">
                                    ${sortedTags.map(tag => this.escapeHtml(tag)).join(' ')}
                                </span>
                            </div>
                        `;
                    }

                    // Links display
                    html += this.renderLinks(card.links);

                    html += this.renderAttachments(card.attachments, card.seqno);

                    // Recurrence display
                    html += this.renderRecurrence(card.recurrence);

                    html += this.renderCardActionBar(card);

                    div.innerHTML = html;
                    return div;
                }
                
                // DEFAULT FORMAT FOR ALL OTHER CARD TYPES
                let html = `
                    <div class="card-header">
                        <div style="display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 3px;">
                                <input type="checkbox" class="card-checkbox" data-seqno="${card.seqno}" style="cursor: pointer; margin: 0;">
                                <span class="card-seqno">#${card.seqno}</span>
                            </div>
                            <h3 class="card-topic" style="margin: 0; flex: 1; min-width: 200px;">${this.escapeHtml(card.topic)}</h3>
                        </div>
                    </div>
                `;

                if (card.description && this.visibleFields.description) {
                    const descriptionId = `desc-${card.seqno}`;
                    const descClass = expandMode ? 'desc-expanded' : 'desc-truncated';
                    const expandBtn = expandMode ? '' : `
                            <button class="btn-expand-desc" onclick="cardManager.toggleDescription(${card.seqno}, this)" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; font-size: 16px; background: rgba(255, 255, 255, 0.9); border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; color: #6b7280; display: flex; align-items: center; justify-content: center; font-weight: bold;" title="Expand/Collapse">
                                +
                            </button>`;
                    html += `
                        <div class="card-field" style="position: relative;">
                            <div class="card-field-value markdown-content ${descClass}" id="${descriptionId}" data-full-desc="${this.escapeHtml(card.description)}">
                                ${this.renderMarkdown(card.description)}
                            </div>
                            ${expandBtn}
                        </div>
                    `;
                }

                // Compact info line: Mode, Category, Priority, Starts, Ends
                html += this.renderInfoLine(card);

                if (card.tags && card.tags.length > 0 && this.visibleFields.tags) {
                    const sortedTags = [...card.tags].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">tags:</span>
                            <div class="card-tags">
                                ${sortedTags.map(tag => `<span class="tag">${this.escapeHtml(tag)}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                if (card.steps && card.steps.length > 0 && this.visibleFields.steps) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">steps:</span>
                            <div class="card-steps">
                                ${card.steps.map((step, i) => `<span class="step">${i + 1}. ${this.escapeHtml(step)}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                if (card.data && Object.keys(card.data).length > 0 && this.visibleFields.data) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">data:</span>
                            <div class="card-data">
                                ${Object.entries(card.data).map(([key, value]) => 
                                    `<div class="data-pair">
                                        <span class="data-key">${this.escapeHtml(key)}:</span>
                                        <span>${this.escapeHtml(value)}</span>
                                    </div>`
                                ).join('')}
                            </div>
                        </div>
                    `;
                }

                if (card.parent && this.visibleFields.parent) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">parent:</span>
                            <div class="card-tags">
                                <span class="tag">${this.escapeHtml(card.parent)}</span>
                            </div>
                        </div>
                    `;
                }

                if (card.children && card.children.length > 0 && this.visibleFields.children) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">children:</span>
                            <div class="card-tags">
                                ${card.children.map(child => `<span class="tag">${this.escapeHtml(child)}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // Links display
                if (card.links && card.links.length > 0 && this.visibleFields.links) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">links:</span>
                            <div class="card-tags">
                                ${card.links.map(link => {
                                    const display = expandMode ? link : (link.length > CardManager.CONFIG.UI.LINK_TRUNCATE_AT ? link.substring(0, CardManager.CONFIG.UI.LINK_TRUNCATE_AT) + '...' : link);
                                    return `<a href="${this.escapeHtml(link)}" target="_blank" class="tag" style="color: #0066cc; text-decoration: none;">🔗 ${this.escapeHtml(display)}</a>`;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                // Attachments display
                if (card.attachments && card.attachments.length > 0 && this.visibleFields.attachments) {
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">attachments:</span>
                            <div class="card-tags">
                                ${card.attachments.map(att => `<a href="file:///${this.escapeHtml(att.replace(/\\/g, '/'))}" class="tag" style="color: #059669; text-decoration: none; cursor: pointer;" title="${this.escapeHtml(att)}">📎 ${this.escapeHtml(att.split(/[/\\]/).pop() || att)}</a>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // Recurrence display
                if (card.recurrence && (card.recurrence.freq?.length > 0 || card.recurrence.days?.length > 0 || card.recurrence.period?.length > 0) && this.visibleFields.recurrence) {
                    const parts = [];
                    if (card.recurrence.freq?.length > 0) parts.push(card.recurrence.freq.join(', '));
                    if (card.recurrence.days?.length > 0) parts.push(card.recurrence.days.join(', '));
                    if (card.recurrence.period?.length > 0) parts.push(card.recurrence.period.join(', '));
                    const recurrenceStr = parts.join(' ');
                    
                    html += `
                        <div class="card-field">
                            <span class="card-field-label">recurrence:</span>
                            <div style="font-family: monospace; font-size: 13px; background: #ede9fe; color: #7c3aed; padding: 6px 10px; border-radius: 4px; display: inline-block;">
                                🔄 ${this.escapeHtml(recurrenceStr)}
                            </div>
                        </div>
                    `;
                }

                html += this.renderCardActionBar(card);

                div.innerHTML = html;
                return div;
            }

            toggleCardMenu(cardElement) {
                const isOpen = cardElement.classList.contains('menu-open');
                // Close the previously open menu directly rather than scanning the DOM
                if (this._openMenuCard && this._openMenuCard !== cardElement) {
                    this._openMenuCard.classList.remove('menu-open');
                }
                if (isOpen) {
                    cardElement.classList.remove('menu-open');
                    this._openMenuCard = null;
                } else {
                    cardElement.classList.add('menu-open');
                    this._openMenuCard = cardElement;
                }
            }

            renderInfoLine(card) {
                if (!this.visibleFields.infoline) return '';
                let html = `<div class="card-field" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">`;
                html += `<span class="card-mode badge-${card.mode.toLowerCase()}">${card.mode}</span>`;
                if (card.category) {
                    html += `
                        <span style="display: flex; align-items: center;">
                            <span class="card-field-label">cat:</span>
                            <span class="card-field-value">${this.escapeHtml(card.category)}</span>
                        </span>
                    `;
                }
                html += `
                    <span style="display: flex; align-items: center;">
                        <span class="card-field-label">pri:</span>
                        <button class="card-priority badge-${card.priority.toLowerCase()} btn-cycle-priority" data-seqno="${card.seqno}" title="Click to cycle priority">${card.priority}</button>
                    </span>
                `;
                if (card.startsOn) {
                    html += `
                        <span style="display: flex; align-items: center;">
                            <span class="card-field-label">starts:</span>
                            <span class="card-field-value">${this.formatDateTime(card.startsOn)}</span>
                        </span>
                    `;
                }
                if (card.endsOn && card.endsOn !== card.startsOn) {
                    html += `
                        <span style="display: flex; align-items: center;">
                            <span class="card-field-label">ends:</span>
                            <span class="card-field-value">${this.formatDateTime(card.endsOn)}</span>
                        </span>
                    `;
                }
                if (card.startsOn && card.endsOn && card.startsOn !== card.endsOn) {
                    const duration = this.calculateDuration(card.startsOn, card.endsOn);
                    const timeRemaining = this.calculateTimeRemaining(card.endsOn);
                    const remainingColor = this.getRemainingColor(card.startsOn, card.endsOn);
                    html += `
                        <span style="display: flex; align-items: center;">
                            <span class="card-field-label">duration:</span>
                            <span class="card-field-value">${duration}</span>
                        </span>
                        <span style="display: flex; align-items: center;">
                            <span class="card-field-label" style="color: ${remainingColor};">remaining:</span>
                            <span class="card-field-value" style="color: ${remainingColor};">${timeRemaining}</span>
                        </span>
                    `;
                }
                html += `</div>`;
                return html;
            }

            renderCardActionBar(card) {
                return `
                    <div class="card-action-bar">
                        <button class="btn-action btn-edit" title="Edit">✎</button>
                        <button class="btn-action btn-complete ${card.completed ? 'completed' : ''}" title="${card.completed ? 'Mark as incomplete' : 'Mark as complete'}">✓</button>
                        <button class="btn-action btn-print" onclick="cardManager.printCard(${card.seqno})" title="Print">🖨</button>
                        <button class="btn-action btn-delete" title="Delete">✕</button>
                    </div>
                `;
            }
            
            toggleCardSelection(seqno) {
                if (this.selectedSeqnos.has(seqno)) {
                    this.selectedSeqnos.delete(seqno);
                } else {
                    this.selectedSeqnos.add(seqno);
                }
                // Sync the checkbox visual state without a full re-render
                const checkbox = document.querySelector(`.card-checkbox[data-seqno="${seqno}"]`);
                if (checkbox) checkbox.checked = this.selectedSeqnos.has(seqno);
            }
            
            renumberCards(orderedCards) {
                // Reassign seqno values in the order provided, starting from 1
                orderedCards.forEach((card, index) => {
                    card.seqno = index + 1;
                });
                // Reorder activeCards array to match the new sequence
                this.activeCards = [...orderedCards];
                // Shift completed and deleted cards above the active range to prevent collisions
                let next = this.activeCards.length + 1;
                [...this.completedCards, ...this.deletedCards]
                    .sort((a, b) => a.seqno - b.seqno)
                    .forEach(card => { card.seqno = next++; });
                this.nextSeqno = next;
                // Clear sort so the new seqno order is visible (sort is now baked in)
                this.sortFields = [];
                this.pendingSort = [];
                document.getElementById('sort-scheme').textContent = '';
                this.setExecuteEnabled(this.pendingFilter !== null);
                this.debouncedSave();
                this.render();
                Toast.success('Cards renumbered in display order');
            }

            render() {
                const container = this.safeGetElement('cards-container');
                let filteredCards = this.getFilteredCards();

                // Update statistics
                this._statActive.textContent    = this.activeCards.length;
                this._statCompleted.textContent = this.completedCards.length;
                this._statDeleted.textContent   = this.deletedCards.length;

                // Show Restore button only when a filter or sort is active
                const pf = this.pendingFilter;
                const hasFilter = !!(pf && (pf.mode || pf.priority || pf.category || pf.search));
                const hasSort = this.pendingSort && this.pendingSort.length > 0;
                this._restoreBtn.style.display = (hasFilter || hasSort) ? '' : 'none';
                this._toggleFiltersortBtn.style.border = (hasFilter || hasSort) ? '3px solid #0f766e' : '';

                if (this.pendingSort && this.pendingSort.length > 0) {
                    filteredCards = this.sortCards(filteredCards);
                }

                // Enable Renum only when cards display is visible, viewing active, and all are displayed
                const panelEl = this.safeGetElement('panel-left');
                const formVisible = getComputedStyle(panelEl).display !== 'none';
                const showRenum = !formVisible && this.cardView === 'active' && filteredCards.length === this.activeCards.length;
                this._renumBtn.disabled      = !showRenum;
                this._renumBtn.style.opacity = showRenum ? '1' : '0.4';
                this._renumBtn.style.cursor  = showRenum ? 'pointer' : 'not-allowed';

                // Apply layout mode class
                container.classList.remove('line-mode', 'expand-mode');
                if (this.layoutMode === 'line-mode') {
                    container.classList.add('line-mode');
                } else if (this.layoutMode === 'expand-mode') {
                    container.classList.add('expand-mode');
                }

                this.lastDisplayedCards = [...filteredCards];
                this.selectedSeqnos.clear();
                this._openMenuCard = null; // DOM will be rebuilt; stale ref must be cleared

                if (filteredCards.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div class="empty-state-text">No cards found</div>
                            <p>Create your first card to get started</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = '';
                    filteredCards.forEach(card => {
                        container.appendChild(this.renderCard(card));
                        // Load attachments asynchronously after card is rendered
                        if (card.attachments && card.attachments.length > 0) {
                            this.loadAttachments(card.seqno, card.attachments);
                        }
                    });
                }

                if (this._categoriesDirty) {
                    this._categoriesDirty = false;
                    this.updateFilterCategoryOptions();
                }

                // Update selected count after full render is complete
                this._statSelected.textContent = filteredCards.length;

                // Set up click handler for cards
                this.setupCardClickHandlers(showRenum);
            }
            
            setupCardClickHandlers(canDrag) {
                const container = this.safeGetElement('cards-container');

                // Abort previous listeners instead of cloning the entire container
                if (this._cardClickAbort) this._cardClickAbort.abort();
                this._cardClickAbort = new AbortController();
                const signal = this._cardClickAbort.signal;

                // Add event listener with delegation for card clicks AND button actions
                container.addEventListener('click', (e) => {
                    // Checkbox clicked
                    if (e.target.closest('.card-checkbox')) {
                        const checkbox = e.target.closest('.card-checkbox');
                        const seqno = parseInt(checkbox.dataset.seqno);
                        if (!isNaN(seqno)) {
                            this.toggleCardSelection(seqno);
                        }
                        return;
                    }

                    // Edit button clicked
                    if (e.target.closest('.btn-edit')) {
                        const card = e.target.closest('.card');
                        if (card && card.dataset.seqno) {
                            this.editCard(parseInt(card.dataset.seqno));
                        }
                        return;
                    }

                    // Delete button clicked
                    if (e.target.closest('.btn-delete')) {
                        const card = e.target.closest('.card');
                        if (card && card.dataset.seqno) {
                            this.confirmDelete(parseInt(card.dataset.seqno));
                        }
                        return;
                    }

                    // Complete button clicked
                    if (e.target.closest('.btn-complete')) {
                        const card = e.target.closest('.card');
                        if (card && card.dataset.seqno) {
                            this.toggleComplete(parseInt(card.dataset.seqno));
                        }
                        return;
                    }

                    // Priority cycle badge clicked
                    if (e.target.closest('.btn-cycle-priority')) {
                        const btn = e.target.closest('.btn-cycle-priority');
                        const seqno = parseInt(btn.dataset.seqno);
                        if (seqno) this.adjustPriority(seqno, 'cycle');
                        return;
                    }

                    // Find the card element for general card clicks
                    let cardElement = e.target.closest('.card');
                    if (!cardElement) return;
                    
                    // Don't show menu if clicking on a link or other interactive element (non-button)
                    if (e.target.closest('a')) {
                        return;
                    }
                    
                    // Toggle inline action bar for non-button card clicks
                    if (!e.target.closest('button')) {
                        this.toggleCardMenu(cardElement);
                    }
                }, { signal });

                // Drag-and-drop reordering (only when unfiltered active view)
                if (canDrag) {
                    let dragSrcSeqno = null;

                    container.querySelectorAll('.card').forEach(card => {
                        card.setAttribute('draggable', 'true');
                    });

                    container.addEventListener('dragstart', (e) => {
                        const card = e.target.closest('.card');
                        if (!card) return;
                        dragSrcSeqno = parseInt(card.dataset.seqno);
                        card.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    }, { signal });

                    container.addEventListener('dragend', (e) => {
                        container.querySelectorAll('.card.dragging').forEach(c => c.classList.remove('dragging'));
                        container.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
                    }, { signal });

                    container.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        const card = e.target.closest('.card');
                        if (!card) return;
                        container.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
                        if (parseInt(card.dataset.seqno) !== dragSrcSeqno) {
                            card.classList.add('drag-over');
                        }
                    }, { signal });

                    container.addEventListener('dragleave', (e) => {
                        // Only remove if leaving to outside the container
                        if (!container.contains(e.relatedTarget)) {
                            container.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
                        }
                    }, { signal });

                    container.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const targetCard = e.target.closest('.card');
                        if (!targetCard || !dragSrcSeqno) return;
                        const targetSeqno = parseInt(targetCard.dataset.seqno);
                        if (targetSeqno === dragSrcSeqno) return;

                        // Read current DOM order, then move src before target
                        const domSeqnos = [...container.querySelectorAll('.card')].map(c => parseInt(c.dataset.seqno));
                        const srcIdx = domSeqnos.indexOf(dragSrcSeqno);
                        const tgtIdx = domSeqnos.indexOf(targetSeqno);
                        domSeqnos.splice(srcIdx, 1);
                        domSeqnos.splice(tgtIdx, 0, dragSrcSeqno);

                        const seqnoToCard = {};
                        this.activeCards.forEach(c => { seqnoToCard[c.seqno] = c; });
                        const newOrder = domSeqnos.map(s => seqnoToCard[s]).filter(Boolean);

                        targetCard.classList.remove('drag-over');
                        this.renumberCards(newOrder);
                    }, { signal });
                }
            }

            // Sync the layout button icon/tooltip to reflect the NEXT state
            syncLayoutButton() {
                const button = document.getElementById('toggle-layout');
                if (!button) return;
                if (this.layoutMode === 'card-mode') {
                    button.textContent = '≡';
                    button.title = 'Switch to one card per line';
                } else if (this.layoutMode === 'line-mode') {
                    button.textContent = '□';
                    button.title = 'Switch to full-width expanded';
                } else {
                    button.textContent = '⊞';
                    button.title = 'Switch to card grid';
                }
            }

            updateFilterCategoryOptions() {
                const select = document.getElementById('filter-category');
                const currentValue = select.value;
                select.innerHTML = '<option value="">All Categories</option>';
                
                this.getAllCategories().forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                });
                
                select.value = currentValue;
            }

            // Enable or disable the Execute button
            setExecuteEnabled(enabled) {
                const btn = document.getElementById('execute-filtersort-btn');
                if (!btn) return;
                btn.disabled = !enabled;
                btn.style.opacity = enabled ? '1' : '0.4';
                btn.style.cursor  = enabled ? 'pointer' : 'not-allowed';
            }

            // Render sort order display
            renderSortOrder() {
                const container = document.getElementById('sort-order-list');

                if (this.sortFields.length === 0) {
                    container.innerHTML = '<div style="font-size: 13px; color: #9ca3af; font-style: italic;">No sort fields selected</div>';
                    return;
                }

                container.innerHTML = '';

                this.sortFields.forEach((sortField, index) => {
                    const item = document.createElement('div');
                    item.className = 'sort-order-item';
                    item.draggable = true;
                    item.dataset.index = index;

                    item.innerHTML = `
                        <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                        <span style="font-weight: 600; color: #14b8a6; min-width: 20px;">${index + 1}.</span>
                        <span class="field-name">${sortField.label}</span>
                        <button class="btn-remove-sort" data-index="${index}">×</button>
                    `;

                    container.appendChild(item);
                });

                // Add event listeners for remove buttons
                container.querySelectorAll('.btn-remove-sort').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        this.sortFields.splice(index, 1);
                        this.renderSortOrder();
                    });
                });

                // Add drag and drop functionality
                this.setupSortOrderDragDrop();
            }

            // Setup drag and drop for sort order
            setupSortOrderDragDrop() {
                const container = document.getElementById('sort-order-list');
                let draggedElement = null;
                let draggedIndex = null;

                container.querySelectorAll('.sort-order-item').forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        draggedElement = item;
                        draggedIndex = parseInt(item.dataset.index);
                        item.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });

                    item.addEventListener('dragend', (e) => {
                        item.classList.remove('dragging');
                        draggedElement = null;
                    });

                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';

                        if (draggedElement && item !== draggedElement) {
                            item.classList.add('drag-over');
                        }
                    });

                    item.addEventListener('dragleave', (e) => {
                        item.classList.remove('drag-over');
                    });

                    item.addEventListener('drop', (e) => {
                        e.preventDefault();
                        item.classList.remove('drag-over');

                        if (draggedElement && item !== draggedElement) {
                            const dropIndex = parseInt(item.dataset.index);

                            // Reorder array
                            const [movedItem] = this.sortFields.splice(draggedIndex, 1);
                            this.sortFields.splice(dropIndex, 0, movedItem);

                            // Re-render
                            this.renderSortOrder();
                        }
                    });
                });
            }

            // Sort cards based on pendingSort array
            sortCards(cards) {
                if (this.pendingSort.length === 0) {
                    return cards;
                }

                return [...cards].sort((a, b) => {
                    for (const { field } of this.pendingSort) {
                        let aVal = a[field] || '';
                        let bVal = b[field] || '';

                        // Convert to lowercase for case-insensitive comparison
                        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                        if (typeof bVal === 'string') bVal = bVal.toLowerCase();

                        // For priority, use custom order
                        if (field === 'priority') {
                            const priorityOrder = { 'acute': 1, 'normal': 2, 'optional': 3 };
                            aVal = priorityOrder[aVal] || 999;
                            bVal = priorityOrder[bVal] || 999;
                        }

                        // For mode, use custom order
                        if (field === 'mode') {
                            const modeOrder = { 'task': 1, 'note': 2, 'data': 3, 'list': 4 };
                            aVal = modeOrder[aVal] || 999;
                            bVal = modeOrder[bVal] || 999;
                        }

                        if (aVal < bVal) return -1;
                        if (aVal > bVal) return 1;
                        // If equal, continue to next sort field
                    }
                    return 0;
                });
            }

            toggleComplete(seqno) {
                // Find card in activeCards or completedCards
                let index = this.activeCards.findIndex(c => c.seqno === seqno);
                let sourceList = null;
                let destinationList = null;
                let movingToActive = false;
                
                if (index !== -1) {
                    // Card is in activeCards, move to completedCards
                    sourceList = this.activeCards;
                    destinationList = this.completedCards;
                } else {
                    // Check if in completedCards
                    index = this.completedCards.findIndex(c => c.seqno === seqno);
                    if (index !== -1) {
                        // Card is in completedCards, move back to activeCards
                        sourceList = this.completedCards;
                        destinationList = this.activeCards;
                        movingToActive = true;
                    }
                }
                
                if (!sourceList) {
                    // Card might be in deletedCards (shouldn't happen, but handle gracefully)
                    console.warn('Cannot toggle completion for deleted card');
                    return;
                }
                
                // Remove from source array
                const [card] = sourceList.splice(index, 1);
                
                // Toggle the completed status
                card.completed = !card.completed;
                
                // Add to destination array in correct seqno order
                destinationList.push(card);
                destinationList.sort((a, b) => a.seqno - b.seqno);
                
                // Save to storage
                this.debouncedSave();
                
                // Re-render to update the UI
                this.render();
                
                // Show toast notification
                const status = card.completed ? 'completed' : 'inactive';
                Toast.success(`Card marked as ${status}`);
            }

            adjustPriority(seqno, direction) {
                // Ascending priority order shared by all three operations
                const priorities = ['Optional', 'Normal', 'Acute'];

                // Locate card across all three arrays
                let cardList = null;
                let index = this.activeCards.findIndex(c => c.seqno === seqno);
                if (index !== -1) {
                    cardList = this.activeCards;
                } else {
                    index = this.completedCards.findIndex(c => c.seqno === seqno);
                    if (index !== -1) {
                        cardList = this.completedCards;
                    } else {
                        index = this.deletedCards.findIndex(c => c.seqno === seqno);
                        if (index !== -1) cardList = this.deletedCards;
                    }
                }
                if (!cardList) { console.warn('Card not found:', seqno); return; }

                const card = cardList[index];
                const current = priorities.indexOf(card.priority);

                let next;
                if (direction === 'cycle') {
                    next = (current + 1) % priorities.length;
                } else if (direction === 'up') {
                    if (current === priorities.length - 1) { console.log('Priority already at maximum (Acute)'); return; }
                    next = current + 1;
                } else { // 'down'
                    if (current === 0) { console.log('Priority already at minimum (Optional)'); return; }
                    next = current - 1;
                }

                card.priority = priorities[next];
                this.debouncedSave();

                // Patch the live card element in-place instead of full re-render
                const cardEl = document.querySelector(`.card[data-seqno="${seqno}"]`);
                if (cardEl) {
                    cardEl.classList.remove('priority-acute', 'priority-normal', 'priority-optional');
                    cardEl.classList.add(`priority-${card.priority.toLowerCase()}`);
                    const badge = cardEl.querySelector('.btn-cycle-priority');
                    if (badge) {
                        badge.className = `card-priority badge-${card.priority.toLowerCase()} btn-cycle-priority`;
                        badge.textContent = card.priority;
                    }
                } else {
                    this.render();
                }
                Toast.success(`Priority set to ${card.priority}`);
            }

                if (confirm('Are you sure you want to delete this card?')) {
                    this.deleteCard(seqno);
